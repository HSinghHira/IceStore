[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; One [program:<name>] per service. <name> must match run-svc.sh and, for
; native/chroot services, the img-<name> stage and /opt/meta/<name>.json.
; priority: 10 data stores, 20 storage/mail, 30 auth, 40 main API,
; 50 workers and frontends, 60 gateway (always last).

[program:postgres]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:redis]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Web app, API and Sidekiq jobs in one Puma process (SIDEKIQ_EMBEDDED, as in
; upstream's compose). Runs migrations, data migrations and seeds first.
[program:dawarich]
command=/usr/local/bin/run-svc %(program_name)s
priority=40
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; One-off: gives the seeded demo@dawarich.app account this install's password
; while it still has the published default one. Exits 0.
[program:admin]
command=/usr/local/bin/run-svc %(program_name)s
priority=50
autorestart=unexpected
exitcodes=0
startsecs=0
stopwaitsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:gateway]
command=/usr/local/bin/run-svc %(program_name)s
priority=60
autorestart=true
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

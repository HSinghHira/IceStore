[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; One [program:<name>] per service. <name> must match run-svc.sh and, for
; native/chroot services, the img-<name> stage and /opt/meta/<name>.json.
; priority: 10 data stores, 20 storage/mail, 30 auth, 40 main API,
; 50 workers and frontends, 60 gateway (always last).

[program:postgres]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:redis]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=3
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Web app, API, WebDAV and background jobs (one Go process), plus aria2.
[program:cloudreve]
command=/usr/local/bin/run-svc %(program_name)s
priority=40
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:gateway]
command=/usr/local/bin/run-svc %(program_name)s
priority=60
autorestart=true
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Prints the CREDENTIALS banner once the app answers, then exits (docker/_common).
[program:credentials]
command=/usr/local/lib/icestore/credentials.sh http://127.0.0.1:8080/api/v4/site/ping
priority=99
autorestart=false
startsecs=0
startretries=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; Both programs run as the sitewatcher user and share /data/sitewatcher.db.

; Web dashboard on port 8080 (runs the database migrations first).
[program:web]
command=sitewatcher web
directory=/app
user=sitewatcher
environment=HOME="/home/sitewatcher"
priority=10
autorestart=true
startsecs=5
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Runs the scheduled checks and sends alerts.
[program:worker]
command=sitewatcher worker
directory=/app
user=sitewatcher
environment=HOME="/home/sitewatcher"
priority=20
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Prints the CREDENTIALS banner once the dashboard answers, then exits (docker/_common).
[program:credentials]
command=/usr/local/lib/icestore/credentials.sh http://127.0.0.1:8080/healthz
priority=99
autorestart=false
startsecs=0
startretries=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

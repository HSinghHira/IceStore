; PostgreSQL for Warracker, added by IceStore. Starts before nginx (10) and
; gunicorn (20); gunicorn retries until it answers.
[program:postgres]
command=/usr/bin/setpriv --reuid=postgres --regid=postgres --init-groups /usr/lib/postgresql/17/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c port=5432 -c unix_socket_directories=/run/postgresql
priority=5
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

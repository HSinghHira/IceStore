[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; One [program:<name>] per service. <name> must match run-svc.sh and, for
; chroot services, the img-<name> stage and /opt/meta/<name>.json.
; priority: 10 data stores, 20 storage and voice, 30 internal services,
; 40 main API, 50 workers and frontends, 60 gateway, 99 credentials banner.

; PostgreSQL, Fluxer's database.
[program:postgres]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Valkey (Redis): cache, sessions and rate limits.
[program:valkey]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; NATS: the message bus every Fluxer service talks over.
[program:nats]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Meilisearch: message and community search.
[program:meilisearch]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; SeaweedFS (S3): uploads, avatars and emoji.
[program:seaweedfs]
command=/usr/local/bin/run-svc %(program_name)s
priority=20
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; One-off: makes the buckets in SeaweedFS (upstream's seaweedfs-init).
[program:s3init]
command=/usr/local/bin/run-svc %(program_name)s
priority=20
autorestart=unexpected
exitcodes=0
startsecs=0
stopwaitsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; LiveKit: voice and video calls.
[program:livekit]
command=/usr/local/bin/run-svc %(program_name)s
priority=20
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Id service.
[program:snowflakes]
command=/usr/local/bin/run-svc %(program_name)s
priority=30
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; User storage service.
[program:users]
command=/usr/local/bin/run-svc %(program_name)s
priority=30
autorestart=true
startsecs=3

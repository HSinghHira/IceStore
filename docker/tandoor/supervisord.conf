[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; Every program gets the environment icestore-init exported (secret key,
; database settings, your Tandoor settings).

[program:postgres]
command=/usr/local/bin/tandoor-svc postgres
priority=10
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Tandoor: migrations and static files, then nginx on 80 and gunicorn.
[program:tandoor]
command=/usr/local/bin/tandoor-svc tandoor
priority=40
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Prints the CREDENTIALS banner once Tandoor answers, then exits (docker/_common).
[program:credentials]
command=/usr/local/lib/icestore/credentials.sh http://127.0.0.1:80/accounts/login/
priority=99
autorestart=false
startsecs=0
startretries=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

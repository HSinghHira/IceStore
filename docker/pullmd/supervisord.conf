[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; One [program:<name>] per service. <name> must match run-svc.sh and, for
; chroot services, the img-<name> stage and /opt/meta/<name>.json.
; priority: 20 sidecars, 40 main app, 60 gateway (always last).

[program:trafilatura]
command=/usr/local/bin/run-svc %(program_name)s
priority=20
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:markitdown]
command=/usr/local/bin/run-svc %(program_name)s
priority=20
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:pullmd]
command=/usr/local/bin/run-svc %(program_name)s
priority=40
autorestart=true
startsecs=5
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:gateway]
command=/usr/local/bin/run-svc %(program_name)s
priority=60
autorestart=true
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

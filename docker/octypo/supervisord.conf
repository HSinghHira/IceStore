[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; Every program gets the environment icestore-init exported.

[program:postgres]
command=setpriv --reuid=postgres --regid=postgres --init-groups /usr/lib/postgresql/16/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql
priority=10
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; The engine (`octypo start`: migrations, then the API, admin and schedulers),
; working in /data/octypo, where it keeps its encrypted secrets file.
[program:octypo]
command=/bin/sh -c 'until /usr/lib/postgresql/16/bin/pg_isready -q -h 127.0.0.1; do sleep 2; done; exec setpriv --reuid=node --regid=node --init-groups octypo start'
directory=/data/octypo
priority=40
autorestart=true
startsecs=10
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Prints the CREDENTIALS banner once Octypo answers, then exits (docker/_common).
[program:credentials]
command=/usr/local/lib/icestore/credentials.sh http://127.0.0.1:3000/health
priority=99
autorestart=false
startsecs=0
startretries=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; priority: 10 data stores, 40 main app, 50 one-off jobs, 60 gateway,
; 99 credentials banner (always last).

; PostgreSQL 16, Inkling's database (upstream's db service).
[program:postgres]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; The Inkling server: web app, API, live editing and MCP on 3000. Runs the migrations on start.
[program:inkling]
command=/usr/local/bin/run-svc %(program_name)s
priority=40
autorestart=true
startsecs=10
stopwaitsecs=40
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; One-off: the first signup key, while there are no accounts.
[program:firstkey]
command=/usr/local/bin/run-svc %(program_name)s
priority=50
autorestart=unexpected
exitcodes=0
startsecs=0
stopwaitsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; nginx on 8080 in front of the app.
[program:gateway]
command=/usr/local/bin/run-svc %(program_name)s
priority=60
autorestart=true
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Prints the CREDENTIALS banner once Inkling answers, then exits (docker/_common).
[program:credentials]
command=/usr/local/lib/icestore/credentials.sh http://127.0.0.1:8080/api/health
priority=99
autorestart=false
startsecs=0
startretries=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

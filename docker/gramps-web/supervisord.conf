[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; Every program gets the environment icestore-init exported (data folders,
; Redis addresses, your Gramps Web settings).

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --dir /data/redis --appendonly yes --save 60 1000
priority=10
autorestart=true
startsecs=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Gramps Web: upstream's entrypoint (secret, user database migrations), then
; gunicorn on 5000.
[program:grampsweb]
command=/docker-entrypoint.sh /bin/sh -c "exec gunicorn -w %(ENV_GUNICORN_NUM_WORKERS)s -b 0.0.0.0:5000 gramps_webapi.wsgi:app --timeout %(ENV_GUNICORN_TIMEOUT)s --limit-request-line 8190 --preload"
directory=/app
priority=40
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; The background worker (imports, exports, reports, search index, emails).
[program:celery]
command=/docker-entrypoint.sh celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=%(ENV_CELERY_CONCURRENCY)s
directory=/app
priority=50
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Prints the CREDENTIALS banner once Gramps Web answers, then exits (docker/_common).
[program:credentials]
command=/usr/local/lib/icestore/credentials.sh http://127.0.0.1:5000/
priority=99
autorestart=false
startsecs=0
startretries=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

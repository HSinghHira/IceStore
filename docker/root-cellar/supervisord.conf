[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; Upstream's four services, with the commands and environment from its
; docker-compose.yml. Each keeps its data in its own folder under /data.

[program:checkbook]
command=node src/server.js
directory=/app/checkbook
environment=PORT="8080",DATA_DIR="/data/checkbook",NODE_ENV="production"
priority=10
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:notes]
command=node --disable-warning=ExperimentalWarning server.js
directory=/app/notes
environment=PORT="8085",DATA_DIR="/data/notes",BACKUP_DIR="/data/notes/backups"
priority=10
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:movies]
command=node --disable-warning=ExperimentalWarning server.js
directory=/app/movies
environment=PORT="8093",DATA_DIR="/data/movies"
priority=10
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; The print system for Labels (upstream's labels entrypoint starts it too).
[program:cups]
command=/usr/sbin/cupsd -f
priority=5
autorestart=true
startsecs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:labels]
command=node server.js
directory=/app/labels
environment=PORT="8095",DATA_DIR="/data/labels"
priority=10
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

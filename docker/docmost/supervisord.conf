[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; One [program:<name>] per service. <name> must match run-svc.sh and, for
; native/chroot services, the img-<name> stage and /opt/meta/<name>.json.
; priority: 10 data stores, 20 storage/mail, 30 auth, 40 main API,
; 50 workers and frontends, 60 gateway (always last).

[program:postgres]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:redis]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Fallback mail server (SMTP on 1025) and viewer (/mail) when no SMTP is set.
[program:mailpit]
command=/usr/local/bin/run-svc %(program_name)s
priority=20
autorestart=true
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; API, web app and live collaboration, one Node process. Runs the database
; migrations first.
[program:docmost]
command=/usr/local/bin/run-svc %(program_name)s
priority=40
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:gateway]
command=/usr/local/bin/run-svc %(program_name)s
priority=60
autorestart=true
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

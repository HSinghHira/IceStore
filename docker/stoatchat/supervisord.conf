[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; One [program:<name>] per service. <name> must match run-svc.sh and, for
; native/chroot services, the img-<name> stage and /opt/meta/<name>.json.
; priority: 10 data stores, 20 storage/mail, 30 auth, 40 main API,
; 50 workers and frontends, 60 gateway (always last).

[program:redis]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; MongoDB, Stoat's database.
[program:mongo]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=5
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; RabbitMQ, the message broker between Stoat's services.
[program:rabbit]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=5
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Silo (S3): uploaded files, avatars and emojis.
[program:silo]
command=/usr/local/bin/run-svc %(program_name)s
priority=20
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; One-off: makes the revolt-uploads bucket, then exits.
[program:s3init]
command=/usr/local/bin/run-svc %(program_name)s
priority=20
autorestart=unexpected
exitcodes=0
startsecs=0
stopwaitsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; LiveKit: voice and video calls.
[program:livekit]
command=/usr/local/bin/run-svc %(program_name)s
priority=20
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; The Stoat services. Each waits for what it connects to (run-svc.sh).
[program:api]
command=/usr/local/bin/run-svc %(program_name)s
priority=40
autorestart=true
startsecs=5

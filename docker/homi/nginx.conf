# Homi gateway on 8080: upstream's deploy/nginx.conf, with core on
# 127.0.0.1 and the IceStore "set PUBLIC_URL" note (homi-guard.conf).
user www-data;
worker_processes 2;
pid /run/nginx-homi.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  client_max_body_size 50M;

  map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  server {
    listen 8080;
    server_name _;
    include /run/homi/guard.conf;

    root /usr/share/homi-web;
    index index.html;
    include /etc/nginx/homi-security-headers.conf;

    location /api/ {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
      proxy_read_timeout 300s;
    }

    location /health/ {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location = /sw.js {
      include /etc/nginx/homi-security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri =404;
    }

    location = /index.html {
      include /etc/nginx/homi-security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri =404;
    }

    location = /manifest.webmanifest {
      include /etc/nginx/homi-security-headers.conf;
      default_type application/manifest+json;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      try_files $uri =404;
    }

    location /module-runtime/ {
      include /etc/nginx/homi-security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      try_files $uri =404;
    }

    location /assets/ {
      include /etc/nginx/homi-security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/homi-security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri $uri/ /index.html;
    }
  }
}

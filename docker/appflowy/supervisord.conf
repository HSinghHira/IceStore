; Prints the CREDENTIALS banner once the app answers, then exits (docker/_common).
[program:credentials]
command=/usr/local/lib/icestore/credentials.sh http://127.0.0.1:8080/api/health
priority=99
autorestart=false
startsecs=0
startretries=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

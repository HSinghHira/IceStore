[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

; priority: 10 data stores, 40 main app, 60 gateway, 99 credentials banner.

; PostgreSQL 17, Sniptide's database (upstream's db service).
[program:postgres]
command=/usr/local/bin/run-svc %(program_name)s
priority=10
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; The Sniptide app (Next.js) on 3000; applies its migrations on start.
[program:sniptide]
command=/usr/local/bin/run-svc %(program_name)s
priority=40
autorestart=true
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; nginx on 8080 in front of the app.
[program:gateway]
command=/usr/local/bin/run-svc %(program_name)s
priority=60
autorestart=true
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Prints the CREDENTIALS banner once Sniptide answers, then exits (docker/_common).
[program:credentials]
command=/usr/local/lib/icestore/credentials.sh http://127.0.0.1:8080/api/health
priority=99
autorestart=false
startsecs=0
startretries=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

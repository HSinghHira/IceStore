; Upstream's docker/php/php.ini for production: errors logged, not shown.
[PHP]
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /var/www/html/storage/logs/php_errors.log

memory_limit = 256M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

default_charset = "UTF-8"

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
; Kestello updates itself in place, so changed files must be noticed.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1

[session]
session.save_handler = files
session.save_path = /var/www/html/storage/sessions
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 3600
session.gc_probability = 1
session.gc_divisor = 100

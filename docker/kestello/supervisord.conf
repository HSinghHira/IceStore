[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=10
autorestart=true
startsecs=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
priority=20
autorestart=true
startsecs=3
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Upstream's optional scheduler (scheduled publishing, backups, update
; checks). It waits until the installer has written config/installed.php.
[program:scheduler]
command=/bin/sh -c 'until [ -f /var/www/html/config/installed.php ]; do sleep 30; done; exec setpriv --reuid=www-data --regid=www-data --init-groups php /var/www/html/bin/cms schedule:work'
priority=30
autorestart=true
startsecs=0
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

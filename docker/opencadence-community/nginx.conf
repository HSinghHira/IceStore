# IceStore: nginx in front of OpenCadence, which has no login and only
# answers to localhost (src/proxy.ts). Every request needs the password
# (made on first start by icestore-init.sh), then reaches the app as a
# localhost request.
user www-data;
worker_processes 1;
pid /run/nginx-icestore.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    # The scheme the browser used: X-Forwarded-Proto from a reverse proxy in
    # front (https), else this request's.
    map $http_x_forwarded_proto $browser_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 8080;
        client_max_body_size 10m;

        auth_basic "OpenCadence";
        auth_basic_user_file /run/icestore/htpasswd;

        location / {
            # Next.js server actions only accept a request whose Origin
            # matches its Host. The app sees localhost, so a same-site Origin
            # becomes localhost too; any other Origin is passed on unchanged
            # and refused by the app, as it would be without nginx.
            set $app_origin $http_origin;
            if ($http_origin = "$browser_scheme://$http_host") {
                set $app_origin "http://localhost:3000";
            }

            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host localhost:3000;
            proxy_set_header Origin $app_origin;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # The health check of the app itself, without the password, for
        # monitoring tools.
        location = /api/revision {
            auth_basic off;
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host localhost:3000;
        }
    }
}

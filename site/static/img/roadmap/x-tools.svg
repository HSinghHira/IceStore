<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <mask id="slots" maskUnits="userSpaceOnUse" x="-200" y="-260" width="400" height="520">
      <rect x="-200" y="-260" width="400" height="520" fill="#fff"/>
      <rect x="-30" y="-262" width="60" height="112" rx="6" fill="#000"/>
      <rect x="-30" y="150" width="60" height="112" rx="6" fill="#000"/>
    </mask>
    <g id="wrench">
      <g mask="url(#slots)">
        <rect x="-26" y="-190" width="52" height="380" rx="20"/>
        <circle cx="0" cy="-168" r="64"/>
        <circle cx="0" cy="168" r="64"/>
      </g>
    </g>
  </defs>
  <g transform="translate(256 256)">
    <g fill="#18a058">
      <circle r="196"/>
      <g id="teeth">
        <rect x="-46" y="-240" width="92" height="90" rx="22"/>
        <rect x="-46" y="150" width="92" height="90" rx="22"/>
        <rect x="-240" y="-46" width="90" height="92" rx="22"/>
        <rect x="150" y="-46" width="90" height="92" rx="22"/>
      </g>
      <use href="#teeth" transform="rotate(45)"/>
    </g>
    <g transform="scale(.82)">
      <g transform="rotate(45)" fill="none" stroke="#fff" stroke-width="26" stroke-linejoin="round"><use href="#wrench" fill="#fff"/></g>
      <g transform="rotate(-45)" fill="none" stroke="#fff" stroke-width="26" stroke-linejoin="round"><use href="#wrench" fill="#fff"/></g>
      <use href="#wrench" transform="rotate(45)" fill="#222"/>
      <use href="#wrench" transform="rotate(-45)" fill="#222"/>
    </g>
  </g>
</svg>

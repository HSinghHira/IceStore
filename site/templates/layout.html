<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}" data-route>
<link rel="canonical" href="{{url}}" data-route>
<link rel="alternate" hreflang="en" href="{{url}}" data-route>
<link rel="alternate" hreflang="x-default" href="{{url}}" data-route>
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
<meta name="author" content="{{author}}">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="{{site_name}}">
<meta name="apple-mobile-web-app-title" content="{{site_name}}">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website" data-route>
<meta property="og:site_name" content="{{site_name}}" data-route>
<meta property="og:locale" content="en_US" data-route>
<meta property="og:title" content="{{title}}" data-route>
<meta property="og:description" content="{{description}}" data-route>
<meta property="og:url" content="{{url}}" data-route>
<meta property="og:image" content="{{og_image}}" data-route>
<meta property="og:image:width" content="1200" data-route>
<meta property="og:image:height" content="630" data-route>
<meta property="og:image:alt" content="{{og_alt}}" data-route>
<meta name="twitter:card" content="summary_large_image" data-route>
<meta name="twitter:title" content="{{title}}" data-route>
<meta name="twitter:description" content="{{description}}" data-route>
<meta name="twitter:image" content="{{og_image}}" data-route>
<meta name="twitter:image:alt" content="{{og_alt}}" data-route>
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}img/apple-touch-icon.png">
<link rel="manifest" href="{{root}}manifest.webmanifest">
<script type="application/ld+json" data-route>{{{jsonld}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{root}}css/style.css">
<script defer src="{{root}}js/icons.js"></script>
<script defer src="{{root}}js/core.js"></script>
<script defer src="{{root}}js/home.js"></script>
<script defer src="{{root}}js/app.js"></script>
<script defer src="{{root}}js/badge.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="bg" aria-hidden="true"><i></i><i></i></div>
<div class="load" id="loadbar" aria-hidden="true"></div>
<div id="app">
{{{content}}}
<footer class="foot">
  <p class="m">Made with 🩵 by <a href="{{author_url}}">{{author}}</a> in New Zealand</p>
  <p>A community project, not affiliated with Zima OS, Casa OS and Homeio.</p>
</footer>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<noscript><style>.hero{min-height:0}</style></noscript>
</body>
</html>

<div class="wrap">
  <div class="top"><a class="logo" href="../../">{{site_name}}</a><a class="back" href="../../#apps">{{icon:arrow-left}}All apps</a></div>
  <main id="main" tabindex="-1" data-page="app">
    <div class="ahero">
      <div>
        <nav aria-label="Breadcrumb"><ol class="crumbs"><li><a href="../../">{{site_name}}</a></li><li><a href="../../#apps">Apps</a></li><li aria-current="page">{{app_name}}</li></ol></nav>
        <div class="ttl">{{{icon}}}<h1>{{app_name}}</h1></div>
        <p class="lead">{{desc}}</p>
        <ul class="chips">{{{chips}}}</ul>
        {{{links}}}
      </div>
    </div>
{{{shots}}}
{{{details}}}

    <section class="sec" style="padding-left:0;padding-right:0;text-align:center" aria-labelledby="gs-h">
      <div class="tabs" role="tablist" aria-label="App information">{{{tabs}}}</div>
{{{panels}}}
    </section>

    <section class="sec" style="padding-left:0;padding-right:0" aria-labelledby="inst-h">
      <div class="os">{{{install}}}</div>
    </section>
  </main>
</div>

name: Build fileship

on:
  push:
    branches: [main]
    paths:
      - "docker/fileship/**"
      - "docker/_common/**"
      - ".github/workflows/build-fileship.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: fileship
      AIO_VERSION: "1.1.0"

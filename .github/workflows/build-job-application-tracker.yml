name: Build job-application-tracker

on:
  push:
    branches: [main]
    paths:
      - "docker/job-application-tracker/**"
      - ".github/workflows/build-job-application-tracker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: job-application-tracker
      AIO_VERSION: "1.0.0"
      kind: wrapper

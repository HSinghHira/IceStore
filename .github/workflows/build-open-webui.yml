name: Build open-webui

on:
  push:
    branches: [main]
    paths:
      - "docker/open-webui/**"
      - "docker/_common/**"
      - ".github/workflows/build-open-webui.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: open-webui
      kind: wrapper

name: Build disk-monitor

on:
  push:
    branches: [main]
    paths:
      - "docker/disk-monitor/**"
      - ".github/workflows/build-disk-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  AIO_VERSION: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/disk-monitor" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/disk-monitor
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=disk-monitor
          cache-to: type=gha,mode=max,scope=disk-monitor
          tags: |
            ${{ env.IMAGE }}:${{ env.AIO_VERSION }}
            ${{ env.IMAGE }}:latest

name: Build ente-minio

on:
  push:
    branches: [main]
    paths:
      - "docker/ente-minio/**"
      - "docker/_common/**"
      - ".github/workflows/build-ente-minio.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: ente-minio
      AIO_VERSION: "1.1.0"

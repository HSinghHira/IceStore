name: Update icons GIF

# Once a week, rebuild the site and re-record the moving icons from the home
# page into icestore-icons.gif (used at the top of README.md). Commits only when
# the app list or an icon changed, then purges the jsDelivr copy the README loads.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-record even if no icons changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-icons-gif
  cancel-in-progress: false

jobs:
  gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: |
          pip install -r site/requirements.txt
          python site/build.py --out _site

      - name: Check for icon changes
        id: sig
        run: |
          sig=$( { grep -o '<div class="mq".*' _site/index.html
                   find _site/app -name 'icon.*' | sort | xargs cat
                   cat .github/scripts/icons_gif.js; } | sha256sum | cut -d' ' -f1 )
          echo "sig=$sig" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" != "true" ] && [ "$sig" = "$(cat .github/icons-gif.sha 2>/dev/null)" ]; then
            echo "Icons unchanged, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.sig.outputs.changed == 'true'
        with:
          node-version: "20"

      - name: Install Playwright and ffmpeg
        if: steps.sig.outputs.changed == 'true'
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.48.2
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Record the marquee
        if: steps.sig.outputs.changed == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          python -m http.server 8765 -d _site >/dev/null 2>&1 &
          sleep 2
          node .github/scripts/icons_gif.js http://localhost:8765/ "$RUNNER_TEMP/frames" 25

      - name: Encode the GIF
        if: steps.sig.outputs.changed == 'true'
        run: |
          # GitHub won't show README images over 10 MB; step down until it fits
          for w in 768 704 640 576; do
            ffmpeg -loglevel error -y -framerate 25 -i "$RUNNER_TEMP/frames/f%04d.png" \
              -vf "scale=$w:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128:reserve_transparent=1:stats_mode=full[p];[b][p]paletteuse=dither=bayer:bayer_scale=5:alpha_threshold=96" \
              -loop 0 icestore-icons.gif
            size=$(stat -c %s icestore-icons.gif)
            echo "width $w: $size bytes"
            [ "$size" -lt 10000000 ] && break
          done

      - name: Commit and push
        if: steps.sig.outputs.changed == 'true'
        run: |
          echo "${{ steps.sig.outputs.sig }}" > .github/icons-gif.sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icestore-icons.gif .github/icons-gif.sha
          git diff --cached --quiet && exit 0
          git commit -m "Update icons GIF"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Purge the jsDelivr cache
        if: steps.sig.outputs.changed == 'true'
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/icestore-icons.gif" || true

name: Build passwordpusher

on:
  push:
    branches: [main]
    paths:
      - "docker/passwordpusher/**"
      - ".github/workflows/build-passwordpusher.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: passwordpusher
      AIO_VERSION: "1.0.0"
      kind: wrapper

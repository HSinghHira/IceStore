name: Build windows

on:
  push:
    branches: [main]
    paths:
      - "docker/windows/**"
      - "docker/_common/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: windows
      AIO_VERSION: "1.0.0"
      kind: wrapper
      platforms: linux/amd64

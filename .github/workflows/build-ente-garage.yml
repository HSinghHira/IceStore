name: Build ente-garage

on:
  push:
    branches: [main]
    paths:
      - "docker/ente-garage/**"
      - "docker/_common/**"
      - ".github/workflows/build-ente-garage.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: ente-garage
      AIO_VERSION: "1.1.0"

name: Build ech0

on:
  push:
    branches: [main]
    paths:
      - "docker/ech0/**"
      - "docker/_common/**"
      - ".github/workflows/build-ech0.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: ech0
      kind: wrapper

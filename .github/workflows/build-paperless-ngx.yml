name: Build paperless-ngx

on:
  push:
    branches: [main]
    paths:
      - "docker/paperless-ngx/**"
      - "docker/_common/**"
      - ".github/workflows/build-paperless-ngx.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: paperless-ngx
      kind: wrapper

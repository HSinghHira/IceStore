name: Build opencadence-community

on:
  push:
    branches: [main]
    paths:
      - "docker/opencadence-community/**"
      - "docker/_common/**"
      - ".github/workflows/build-opencadence-community.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: opencadence-community
      AIO_VERSION: "1.0.0"
      kind: wrapper

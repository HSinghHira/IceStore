name: Build fcaptcha

on:
  push:
    branches: [main]
    paths:
      - "docker/fcaptcha/**"
      - ".github/workflows/build-fcaptcha.yml"
  workflow_dispatch:

permissions:
  contents: write   # move_pin.sh commits the compose pin after the push
  packages: write
  actions: write    # and starts the store rebuild

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: fcaptcha
      kind: wrapper

name: Build root-cellar

on:
  push:
    branches: [main]
    paths:
      - "docker/root-cellar/**"
      - "docker/_common/**"
      - ".github/workflows/build-root-cellar.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: root-cellar
      AIO_VERSION: "1.0.0"
      kind: wrapper

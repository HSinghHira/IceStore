name: Build pocket-id

on:
  push:
    branches: [main]
    paths:
      - "docker/pocket-id/**"
      - ".github/workflows/build-pocket-id.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: pocket-id
      AIO_VERSION: "1.0.0"
      kind: wrapper

name: Build doory-art

on:
  push:
    branches: [main]
    paths:
      - "docker/doory-art/**"
      - "docker/_common/**"
      - ".github/workflows/build-doory-art.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: doory-art
      AIO_VERSION: "1.1.0"

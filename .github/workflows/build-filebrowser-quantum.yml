name: Build filebrowser-quantum

on:
  push:
    branches: [main]
    paths:
      - "docker/filebrowser-quantum/**"
      - "docker/_common/**"
      - ".github/workflows/build-filebrowser-quantum.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: filebrowser-quantum
      kind: wrapper

name: Build paperless-ngx-full

on:
  push:
    branches: [main]
    paths:
      - "docker/paperless-ngx-full/**"
      - "docker/_common/**"
      - ".github/workflows/build-paperless-ngx-full.yml"
  workflow_dispatch:

permissions:
  contents: write   # move_pin.sh commits the compose pin after the push
  packages: write
  actions: write    # and starts the store rebuild

# The build steps are in build-image.yml (shared by every app).
# Wrapper apps add `kind: wrapper` (and drop the docker/_common line above
# unless their Dockerfile copies from it); amd64-only apps add
# `platforms: linux/amd64`.
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: paperless-ngx-full
      kind: wrapper

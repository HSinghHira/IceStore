name: Build cobalt

on:
  push:
    branches: [main]
    paths:
      - "docker/cobalt/**"
      - "docker/_common/**"
      - ".github/workflows/build-cobalt.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: cobalt
      AIO_VERSION: "1.1.0"

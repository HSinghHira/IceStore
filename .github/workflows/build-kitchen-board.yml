name: Build kitchen-board

on:
  push:
    branches: [main]
    paths:
      - "docker/kitchen-board/**"
      - ".github/workflows/build-kitchen-board.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: kitchen-board
      AIO_VERSION: "1.0.0"
      kind: wrapper

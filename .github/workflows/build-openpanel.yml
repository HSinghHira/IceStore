name: Build openpanel

on:
  push:
    branches: [main]
    paths:
      - "docker/openpanel/**"
      - "docker/_common/**"
      - ".github/workflows/build-openpanel.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: openpanel
      AIO_VERSION: "1.0.0"

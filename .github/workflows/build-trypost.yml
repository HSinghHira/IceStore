name: Build trypost

on:
  push:
    branches: [main]
    paths:
      - "docker/trypost/**"
      - "docker/_common/**"
      - ".github/workflows/build-trypost.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: trypost
      AIO_VERSION: "1.0.0"

name: Build github-release-monitor

on:
  push:
    branches: [main]
    paths:
      - "docker/github-release-monitor/**"
      - ".github/workflows/build-github-release-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: github-release-monitor
      AIO_VERSION: "1.0.0"
      kind: wrapper

name: Build k7

on:
  push:
    branches: [main]
    paths:
      - "docker/k7/**"
      - "docker/_common/**"
      - ".github/workflows/build-k7.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: k7
      AIO_VERSION: "1.1.1"

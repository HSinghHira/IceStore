name: Build cloudreve-pro

on:
  push:
    branches: [main]
    paths:
      - "docker/cloudreve-pro/**"
      - "docker/_common/**"
      - ".github/workflows/build-cloudreve-pro.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: cloudreve-pro
      AIO_VERSION: "1.1.0"

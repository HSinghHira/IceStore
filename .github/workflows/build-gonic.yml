name: Build gonic

on:
  push:
    branches: [main]
    paths:
      - "docker/gonic/**"
      - "docker/_common/**"
      - ".github/workflows/build-gonic.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: gonic
      kind: wrapper

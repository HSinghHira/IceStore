name: Build and publish app store

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the public base URL
        id: cfg
        run: echo "base=$(jq -r .base_url site/site.json)" >> "$GITHUB_OUTPUT"

      - name: Build app store bundle
        uses: IceWhaleTech/build-appstore-action@main
        with:
          source: .
          output: dist
          base-url: ${{ steps.cfg.outputs.base }}

      - name: Add latest.zip
        run: |
          zip -r dist/latest.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "dist/*" \
            -x "_site/*" \
            -x "site/*"

      - name: Add one link per OS
        run: |
          test -f dist/store.json || { echo "::error::dist/store.json was not built"; exit 1; }
          cp dist/store.json dist/ZimaOS
          cp dist/latest.zip dist/CasaOS
          cp dist/latest.zip dist/Homeio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Build the website into the same bundle
        run: |
          pip install -r site/requirements.txt
          python site/build.py --out dist --no-clean

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Build and publish app store

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the site sorts apps by when they were added and updated

      - name: Read the public base URL
        id: cfg
        run: echo "base=$(jq -r .base_url site/site.json)" >> "$GITHUB_OUTPUT"

      - name: Build app store bundle
        uses: IceWhaleTech/build-appstore-action@c9bb47fad5b32d7928a07978fad68801f52e910f # main, 2026-10-21
        with:
          source: .
          output: dist
          base-url: ${{ steps.cfg.outputs.base }}

      - name: Add store.zip
        run: |
          zip -r dist/store.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".claude/*" \
            -x ".history/*" \
            -x "dist/*" \
            -x "_site/*" \
            -x "site/*" \
            -x "docker/*" \
            -x "justfile"

      - name: Check the store files
        run: |
          test -f dist/store.json || { echo "::error::dist/store.json was not built"; exit 1; }
          test -f dist/store.zip || { echo "::error::dist/store.zip was not built"; exit 1; }
          cp dist/store.zip dist/latest.zip   # old name, kept as a fallback
          ls -la dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Build the website into the same bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub stars for the app pages (higher API limit)
        run: |
          pip install -r site/requirements.txt
          python site/build.py --out dist --no-clean

      - name: Draw the app badges (app-badge/<app>.svg)
        run: |
          pip install pillow==13.0.0 fonttools==4.67.0
          python .github/scripts/app_badges.py --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Build select

on:
  push:
    branches: [main]
    paths:
      - "docker/select/**"
      - "docker/_common/**"
      - ".github/workflows/build-select.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: select
      AIO_VERSION: "1.0.1"
      kind: wrapper

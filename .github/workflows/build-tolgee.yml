name: Build tolgee

on:
  push:
    branches: [main]
    paths:
      - "docker/tolgee/**"
      - "docker/_common/**"
      - ".github/workflows/build-tolgee.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: tolgee
      AIO_VERSION: "1.0.0"

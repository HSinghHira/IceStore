name: Build gramps-web

on:
  push:
    branches: [main]
    paths:
      - "docker/gramps-web/**"
      - "docker/_common/**"
      - ".github/workflows/build-gramps-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: gramps-web
      kind: wrapper

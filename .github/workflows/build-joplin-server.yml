name: Build joplin-server

on:
  push:
    branches: [main]
    paths:
      - "docker/joplin-server/**"
      - "docker/_common/**"
      - ".github/workflows/build-joplin-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: joplin-server
      kind: wrapper

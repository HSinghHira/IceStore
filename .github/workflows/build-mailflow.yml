name: Build mailflow

on:
  push:
    branches: [main]
    paths:
      - "docker/mailflow/**"
      - ".github/workflows/build-mailflow.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  AIO_VERSION: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mailflow" >> "$GITHUB_ENV"

      - name: Record the upstream images' start-up settings
        working-directory: docker/mailflow
        run: bash capture-meta.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/mailflow
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=mailflow
          cache-to: type=gha,mode=max,scope=mailflow
          tags: |
            ${{ env.IMAGE }}:${{ env.AIO_VERSION }}
            ${{ env.IMAGE }}:latest

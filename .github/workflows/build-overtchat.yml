name: Build overtchat

on:
  push:
    branches: [main]
    paths:
      - "docker/overtchat/**"
      - ".github/workflows/build-overtchat.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: overtchat
      AIO_VERSION: "1.0.1"
      kind: wrapper

name: Build cartvibe

on:
  push:
    branches: [main]
    paths:
      - "docker/cartvibe/**"
      - "docker/_common/**"
      - ".github/workflows/build-cartvibe.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: cartvibe
      kind: wrapper
      platforms: linux/amd64

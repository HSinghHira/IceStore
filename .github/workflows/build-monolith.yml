name: Build monolith

on:
  push:
    branches: [main]
    paths:
      - "docker/monolith/**"
      - "docker/_common/**"
      - ".github/workflows/build-monolith.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: monolith
      platforms: linux/amd64

name: Build firefly-iii

on:
  push:
    branches: [main]
    paths:
      - "docker/firefly-iii/**"
      - "docker/_common/**"
      - ".github/workflows/build-firefly-iii.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: firefly-iii
      AIO_VERSION: "1.0.2"
      kind: wrapper

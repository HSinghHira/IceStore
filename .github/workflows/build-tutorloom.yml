name: Build tutorloom

on:
  push:
    branches: [main]
    paths:
      - "docker/tutorloom/**"
      - "docker/_common/**"
      - ".github/workflows/build-tutorloom.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: tutorloom
      AIO_VERSION: "1.1.0"
      platforms: linux/amd64

name: Build vikunja

on:
  push:
    branches: [main]
    paths:
      - "docker/vikunja/**"
      - "docker/_common/**"
      - ".github/workflows/build-vikunja.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: vikunja
      kind: wrapper

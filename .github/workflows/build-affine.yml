name: Build affine

on:
  push:
    branches: [main]
    paths:
      - "docker/affine/**"
      - "docker/_common/**"
      - ".github/workflows/build-affine.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: affine
      AIO_VERSION: "1.2.0"

name: Build appflowy

on:
  push:
    branches: [main]
    paths:
      - "docker/appflowy/**"
      - "docker/_common/**"
      - ".github/workflows/build-appflowy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: appflowy
      AIO_VERSION: "1.2.0"

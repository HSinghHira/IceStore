name: Build isponsorblocktv

on:
  push:
    branches: [main]
    paths:
      - "docker/isponsorblocktv/**"
      - ".github/workflows/build-isponsorblocktv.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: isponsorblocktv
      AIO_VERSION: "1.0.0"
      kind: wrapper

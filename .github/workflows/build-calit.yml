name: Build calit

on:
  push:
    branches: [main]
    paths:
      - "docker/calit/**"
      - "docker/_common/**"
      - ".github/workflows/build-calit.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: calit
      AIO_VERSION: "1.1.0"

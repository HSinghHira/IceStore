name: Build strava-dawarich-sync

on:
  push:
    branches: [main]
    paths:
      - "docker/strava-dawarich-sync/**"
      - ".github/workflows/build-strava-dawarich-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: strava-dawarich-sync
      AIO_VERSION: "1.0.0"
      kind: wrapper

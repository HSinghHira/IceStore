name: Build penpot

on:
  push:
    branches: [main]
    paths:
      - "docker/penpot/**"
      - "docker/_common/**"
      - ".github/workflows/build-penpot.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
# Wrapper apps add `kind: wrapper` (and drop the docker/_common line above
# unless their Dockerfile copies from it); amd64-only apps add
# `platforms: linux/amd64`.
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: penpot

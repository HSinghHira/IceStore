name: Build warracker

on:
  push:
    branches: [main]
    paths:
      - "docker/warracker/**"
      - "docker/_common/**"
      - ".github/workflows/build-warracker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: warracker
      AIO_VERSION: "1.0.0"
      kind: wrapper

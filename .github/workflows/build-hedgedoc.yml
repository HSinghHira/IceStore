name: Build hedgedoc

on:
  push:
    branches: [main]
    paths:
      - "docker/hedgedoc/**"
      - ".github/workflows/build-hedgedoc.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The build steps are in build-image.yml (shared by every app).
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: hedgedoc
      kind: wrapper

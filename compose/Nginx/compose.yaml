# Generated from Apps/nginx/docker-compose.yml by platforms/generate.py.
# Do not edit here; change the master file or platforms/mos/overrides/nginx.yml.
name: nginx
services:
  nginx:
    image: nginx:1.31.10-alpine
    container_name: nginx
    restart: unless-stopped
    network_mode: bridge
    environment:
    - TZ=$TZ
    entrypoint:
    - /bin/sh
    - -c
    - |
      if ! ls /etc/nginx/conf.d/*.conf >/dev/null 2>&1 && ! ls /etc/nginx/templates/*.template >/dev/null 2>&1; then
        printf '%s\n' 'server {' '    listen 80;' '    listen [::]:80;' '    server_name _;' '    root /usr/share/nginx/html;' '    index index.html index.htm;' '    location / {' '        try_files $$uri $$uri/ =404;' '    }' '}' > /etc/nginx/conf.d/default.conf
      fi
      if [ -z "$$(ls -A /usr/share/nginx/html 2>/dev/null)" ]; then
        printf '%s\n' '<!DOCTYPE html><html><head><title>Nginx on IceStore</title></head><body style="font-family:sans-serif;max-width:40em;margin:4em auto">' '<h1>Nginx is running</h1>' '<p>Put your website files in <code>${APPDATA}/html</code> with the Files app. The first page must be called <code>index.html</code>.</p>' '</body></html>' > /usr/share/nginx/html/index.html
      fi
      exec /docker-entrypoint.sh nginx -g 'daemon off;'
    ports:
    - target: 80
      published: '6849'
      protocol: tcp
    volumes:
    - type: bind
      source: ${APPDATA}/html
      target: /usr/share/nginx/html
      bind:
        create_host_path: true
    - type: bind
      source: ${APPDATA}/conf.d
      target: /etc/nginx/conf.d
      bind:
        create_host_path: true
    - type: bind
      source: ${APPDATA}/templates
      target: /etc/nginx/templates
      bind:
        create_host_path: true
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:80/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 8M

name: qbittorrent

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.3-ls489
    container_name: qbittorrent
    restart: unless-stopped
    stop_grace_period: 60s
    network_mode: bridge
    environment:
      - TZ=$TZ
      - PUID=$PUID
      - PGID=$PGID
      - WEBUI_PORT=6805
      - TORRENTING_PORT=6806
    ports:
      - target: 6805
        published: "6805"
        protocol: tcp
      - target: 6806
        published: "6806"
        protocol: tcp
      - target: 6806
        published: "6806"
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/Downloads
        target: /downloads
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:6805/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/qbittorrent/icon.png
    x-casaos:
      id: com.icestore.qbittorrent
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone, for schedules. It is filled in from your ZimaOS
              time zone.
        - container: PUID
          description:
            en_US: >-
              The user that owns downloaded files. It is filled in by ZimaOS.
        - container: PGID
          description:
            en_US: >-
              The group that owns downloaded files. It is filled in by ZimaOS.
        - container: WEBUI_PORT
          description:
            en_US: >-
              The web UI port inside the container. It must stay the same as
              the published port (6805), or the page refuses to sign in.
        - container: TORRENTING_PORT
          description:
            en_US: >-
              The port other peers connect to (TCP and UDP). It must stay the
              same as the published port (6806). Forward it on your router
              for faster downloads.
      ports:
        - container: "6805"
          description:
            en_US: qBittorrent web UI, published on host as 6805
        - container: "6806"
          description:
            en_US: >-
              BitTorrent connections from other peers (TCP and UDP),
              published on host as 6806
      volumes:
        - container: /config
          description:
            en_US: >-
              qBittorrent's settings, torrent list and resume data.
        - container: /downloads
          description:
            en_US: >-
              Where downloads are saved: /DATA/Downloads on your ZimaOS.

x-casaos:
  id: com.icestore.qbittorrent
  architectures:
    - amd64
    - arm64
  main: qbittorrent
  author: HSinghHira
  category: Media
  developer: qBittorrent
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/qbittorrent/icon.png
  title:
    en_US: qBittorrent
  tagline:
    en_US: BitTorrent client with a web UI
  description:
    en_US: >-
      Visit: [https://icestore.hsinghhira.me/app/qbittorrent/](https://icestore.hsinghhira.me/app/qbittorrent/) for full details


      qBittorrent downloads torrents and magnet links on your ZimaOS, so
      your computer does not have to stay on. Add and manage downloads from
      any browser.


      **Features**


      - Torrents and magnet links, with sequential download and file
        priorities

      - RSS feeds with download rules

      - Built-in torrent search with plugins

      - Speed limits and an alternative speed schedule

      - Categories, tags and a watched folder


      **How to use?**


      1. Open qBittorrent. Sign in as admin with the temporary password in
         the app's logs.

      2. Right away, set your own user name and password in Tools, Options,
         Web UI.

      3. Add a torrent or magnet link. Files land in /DATA/Downloads.
  tips:
    before_install:
      en_US: >-
        1. Start the installation. It is ready in a few seconds.


        2. Open qBittorrent. The user name is admin. The password is a
           temporary one, written in the app's logs.


        3. Right away, open Tools, Options, Web UI and set your own password.
           Until you do, a new temporary password is made on every restart.


        4. Downloads are saved in /DATA/Downloads.
  index: /
  port_map: "6805"
  scheme: http
  is_uncontrolled: false
  version: "5.3.0_v2.1.3-ls489"
  update_at: "2026-11-24"
  release_notes:
    en_US: |-
      - First IceStore release: lscr.io/linuxserver/qbittorrent 5.3.0_v2.1.3-ls489
      - Web UI on port 6805 and peer connections on port 6806 (TCP and UDP)
      - Downloads go to /DATA/Downloads
  repo: "https://github.com/qbittorrent/qBittorrent"
  support: "https://github.com/linuxserver/docker-qbittorrent/issues"
  docs: "https://docs.linuxserver.io/images/docker-qbittorrent/"

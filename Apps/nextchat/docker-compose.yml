name: nextchat

services:
  nextchat:
    image: yidadaa/chatgpt-next-web:v2.16.1
    container_name: nextchat
    restart: unless-stopped
    network_mode: bridge
    environment:
      - TZ=$TZ
    ports:
      - target: 3000
        published: "6846"
        protocol: tcp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/nextchat/icon.png
    x-casaos:
      id: com.icestore.nextchat
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS
              time zone.
      ports:
        - container: "3000"
          description:
            en_US: >-
              NextChat web app, published on host as 6846

x-casaos:
  id: com.icestore.nextchat
  architectures:
    - amd64
    - arm64
  main: nextchat
  author: HSinghHira
  category: AI
  developer: "ChatGPTNextWeb"
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/nextchat/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/nextchat/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/nextchat/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/nextchat/screenshot-3.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/nextchat/screenshot-1.png
  title:
    en_US: NextChat
  tagline:
    en_US: Light, fast AI chat app for GPT, Claude, Gemini and local models
  description:
    en_US: >-
      Visit: [https://icestore.hsinghhira.me/app/nextchat/](https://icestore.hsinghhira.me/app/nextchat/) for full details


      NextChat is a clean chat app for AI models. Bring your own key for
      OpenAI, Anthropic, Google, DeepSeek and others, or use local
      models, and keep your chats in your browser. Masks (prompt
      templates) and Markdown make it handy for everyday work.


      **Features**


      - OpenAI, Anthropic, Google Gemini, DeepSeek, Moonshot and other
        providers

      - Masks with your own prompts, and a prompt library

      - Markdown, code highlighting, LaTeX and Mermaid

      - Chats kept in your browser, with export and sync to WebDAV or
        Upstash

      - Optional access password when you set server keys


      **How to use?**


      1. Open NextChat, press Settings and enter your API key and
         provider.

      2. Start chatting.
  tips:
    before_install:
      en_US: >-
        1. Start the installation. It is ready in a few seconds.


        2. Without server keys, each person enters their own key in
           Settings. If you set OPENAI_API_KEY in the app settings,
           also set CODE to a password so not everyone on your network
           can use your key.
  index: /
  port_map: "6846"
  scheme: http
  is_uncontrolled: false
  version: "v2.16.1"
  update_at: "2026-11-25"
  release_notes:
    en_US: |-
      - First IceStore release: yidadaa/chatgpt-next-web v2.16.1 on port 6846
  repo: "https://github.com/ChatGPTNextWeb/NextChat"
  support: "https://github.com/ChatGPTNextWeb/NextChat/issues"
  docs: "https://github.com/ChatGPTNextWeb/NextChat#readme"

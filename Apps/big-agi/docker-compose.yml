name: big-agi

services:
  big-agi:
    image: ghcr.io/enricoros/big-agi:v2.1.3
    container_name: big-agi
    restart: unless-stopped
    network_mode: bridge
    environment:
      - TZ=$TZ
    ports:
      - target: 3000
        published: "6845"
        protocol: tcp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/big-agi/icon.png
    x-casaos:
      id: com.icestore.big-agi
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS
              time zone.
      ports:
        - container: "3000"
          description:
            en_US: >-
              big-AGI web app, published on host as 6845

x-casaos:
  id: com.icestore.big-agi
  architectures:
    - amd64
    - arm64
  main: big-agi
  author: HSinghHira
  category: AI
  developer: "enricoros"
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/big-agi/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/big-agi/screenshot-1.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/big-agi/screenshot-1.png
  title:
    en_US: big-AGI
  tagline:
    en_US: AI chat workspace for many models side by side, with personas and voice
  description:
    en_US: >-
      Visit: [https://icestore.hsinghhira.me/app/big-agi/](https://icestore.hsinghhira.me/app/big-agi/) for full details


      big-AGI is a chat app for working with many AI models at once.
      Compare answers from OpenAI, Anthropic, Google, Mistral, Groq,
      OpenRouter and your own Ollama side by side, use personas, voice,
      drawing and code tools.


      **Features**


      - Many providers and local models (Ollama, LM Studio, LocalAI)

      - Beam to ask several models at once and merge the best answer

      - Personas, voice input and output, and image generation

      - Code highlighting, diagrams and document attachments

      - Chats and keys kept in your browser


      **How to use?**


      1. Open big-AGI and press Models, then add a service with your API
         key or your Ollama address.

      2. Start chatting.
  tips:
    before_install:
      en_US: >-
        1. Start the installation. It is ready in a few seconds.


        2. big-AGI keeps your chats and keys in the browser you use.
           For Ollama on this ZimaOS, use
           http://[ZIMAOS-IP-ADDRESS]:6844 as the host.
  index: /
  port_map: "6845"
  scheme: http
  is_uncontrolled: false
  version: "v2.1.3"
  update_at: "2026-11-25"
  release_notes:
    en_US: |-
      - First IceStore release: ghcr.io/enricoros/big-agi v2.1.3 on port 6845
  repo: "https://github.com/enricoros/big-AGI"
  support: "https://github.com/enricoros/big-AGI/issues"
  docs: "https://github.com/enricoros/big-AGI#readme"

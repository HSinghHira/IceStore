name: ente-seaweedfs

services:
  ente-seaweedfs:
    image: ghcr.io/hsinghhira/ente-seaweedfs:latest
    container_name: ente-seaweedfs
    restart: unless-stopped
    stop_grace_period: 90s
    privileged: true
    environment:
      - TZ=$TZ
      - PUBLIC_URL=http://localhost:6660
    ports:
      - target: 8080
        published: "6660"
        protocol: tcp
      - target: 8081
        published: "6661"
        protocol: tcp
      - target: 8082
        published: "6662"
        protocol: tcp
      - target: 8083
        published: "6663"
        protocol: tcp
      - target: 8104
        published: "6664"
        protocol: tcp
      - target: 8105
        published: "6665"
        protocol: tcp
      - target: 8106
        published: "6666"
        protocol: tcp
      - target: 8107
        published: "6667"
        protocol: tcp
      - target: 8108
        published: "6668"
        protocol: tcp
      - target: 8109
        published: "6669"
        protocol: tcp
      - target: 8110
        published: "6670"
        protocol: tcp
      - target: 8111
        published: "6671"
        protocol: tcp
      - target: 8112
        published: "6672"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3072M
        reservations:
          cpus: "0.25"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-seaweedfs/icon.png
    x-casaos:
      id: com.icestore.ente-seaweedfs
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS time zone.
              Leave it unless you need another.
        - container: PUBLIC_URL
          description:
            en_US: >-
              The address of the Web App, like
              http://your-zimaos-ip:6660. Change localhost to your ZimaOS
              IP, or phones and other computers cannot use Ente. The other
              apps use the same address with the next ports: 6661 API,
              6662 Public Albums, 6663 photo storage, 6664 mail viewer,
              and 6665 to 6672 for Accounts, Auth, Cast, Public Locker,
              Embed, Paste, Locker and Public Memories.
      ports:
        - container: "8080"
          description:
            en_US: Web App (Ente Photos), published on host as 6660
        - container: "8081"
          description:
            en_US: Ente API - the server address for the phone and desktop apps, published on host as 6661
        - container: "8082"
          description:
            en_US: Public Albums (shared album links), published on host as 6662
        - container: "8083"
          description:
            en_US: >-
              Photo storage (SeaweedFS S3). Phones and browsers upload and
              download your encrypted files here, published on host as 6663
        - container: "8104"
          description:
            en_US: Mail viewer for sign-up codes and other Ente emails, published on host as 6664
        - container: "8105"
          description:
            en_US: Accounts app (passkeys and family invites), published on host as 6665
        - container: "8106"
          description:
            en_US: Ente Auth web app (your two-factor codes), published on host as 6666
        - container: "8107"
          description:
            en_US: Cast app (show albums on a TV), published on host as 6667
        - container: "8108"
          description:
            en_US: Public Locker (shared Locker links), published on host as 6668
        - container: "8109"
          description:
            en_US: Embed app (albums inside other web pages), published on host as 6669
        - container: "8110"
          description:
            en_US: Ente Paste (share text that deletes itself), published on host as 6670
        - container: "8111"
          description:
            en_US: Ente Locker web app (store important documents), published on host as 6671
        - container: "8112"
          description:
            en_US: Public Memories (shared memory links), published on host as 6672
      volumes:
        - container: /data
          description:
            en_US: >-
              Your encrypted photos and videos (SeaweedFS), the database,
              secret keys and settings.

x-casaos:
  id: com.icestore.ente-seaweedfs
  architectures:
    - amd64
    - arm64
  main: ente-seaweedfs
  author: HSinghHira
  category: Media
  developer: ente-io
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-seaweedfs/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-seaweedfs/screenshot-1.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-seaweedfs/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-seaweedfs/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-seaweedfs/screenshot-3.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-seaweedfs/screenshot-4.png
  title:
    en_US: Ente - SeaweedFS S3
  tagline:
    en_US: End-to-end encrypted photo storage, with SeaweedFS for the files
  description:
    en_US: >-
      Ente is a self-hosted, end-to-end encrypted place to store, share and
      rediscover your photos and videos on all your devices. This is Ente in
      a single container, with PostgreSQL, SeaweedFS, an open-source object store built for very many files, and a mail viewer
      for sign-up codes inside. Secret keys and passwords are made for you on
      first start.


      **Features**


      - End-to-end encryption for every photo and video


      - All ten Ente web apps, each on its own port: Photos, Public
        Albums, Accounts, Auth, Cast, Locker, Public Locker, Embed,
        Paste and Public Memories


      - Works with the Ente phone and desktop apps


      - SeaweedFS for S3-compatible photo storage, fast even with millions of files


      - Built-in mail viewer on port 6664 for sign-up codes, or use your
        own email server


      - No 10 GB limit: every account gets 100 TB by default


      **How to use?**

      1. Open Ente - SeaweedFS S3 from the Zima OS dashboard.

      2. Sign up with your email and a password.

      3. Open the mail viewer on port 6664 to read your sign-up code.

      4. Type the code to finish signing up.

      5. In the Ente phone app, tap the first screen 7 times and set the
         server to http://your-zimaos-ip:6661.

      6. Upload photos and share albums.
  tips:
    before_install:
      en_US: >-
        1. Open the app configuration before you install.


        2. Find PUBLIC_URL. Change localhost to your ZimaOS IP, for example
           http://192.168.1.20:6660 (your own IP will differ). Phones
           cannot use localhost.


        3. More settings, like your own email server and sign-up, are listed
           on the Ente - SeaweedFS S3 page at
           https://icestore.hsinghhira.me/app/ente-seaweedfs/ (Variables tab). You
           can add them now or later in the app settings.


        4. Start the installation.


        5. Wait about three minutes. The first start sets up the database.


        6. Open the app logs and scroll to the top. Find the line that says
           "mail viewer login". Write down the password.


        7. Open http://your-zimaos-ip:6660 in your browser. Sign up with
           your email and a password.


        8. Open http://your-zimaos-ip:6664 in a new tab. Sign in
           as admin with the mail password. Copy the code from the email.


        9. Type the code in Ente to finish signing up.


        10. For the phone app: tap the first screen 7 times. Set the server
            to http://your-zimaos-ip:6661 and sign in.
  index: /
  port_map: "6660"
  scheme: http
  is_uncontrolled: false
  version: "20fb631"
  update_at: "2026-10-27"
  release_notes:
    en_US: |-
      - New ports: 6660 Web App, 6661 API, 6662 Public Albums, 6663 photo storage,
        6664 mail viewer, 6665-6672 the other web apps
      - Adds the Accounts (passkeys), Auth, Cast, Public Locker, Embed, Paste, Locker
        and Public Memories apps, and tells the Ente server where each one is
      - Mail viewer has its own port; /mail/ on the Web App still works
      - Old installs on 6137-6140 keep working: every address counts up from
        PUBLIC_URL's port. Reinstall to get the new apps' ports
      - New settings ENTE_APPS_* (Ente's own names); ENTE_ALBUMS_URL still works
      - Single-container Ente with SeaweedFS storage and one data folder
      - Database, storage and museum keys are made on first start, so each install gets its own
      - Sign-up codes go to the built-in mail viewer unless you set your own email server
      - Every account gets 100 TB instead of Ente's 10 GB (ENTE_AIO_STORAGE_GB)
      - server 20fb631, web 817ce84 (Ente only publishes commit tags; they follow latest)
      - seaweedfs 4.48, mailpit v1.32.0, PostgreSQL 15
  repo: "https://github.com/ente/ente"
  support: "https://github.com/ente/ente/issues"
  docs: "https://ente.com/help/self-hosting/"

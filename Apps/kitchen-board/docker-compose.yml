name: kitchen-board

services:
  kitchen-board:
    image: ghcr.io/hsinghhira/kitchen-board:latest
    container_name: kitchen-board
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: bridge
    environment:
      - TZ=$TZ
      - ADMIN_EMAIL=CHANGEME@example.com
      - ADMIN_PASSWORD=
    ports:
      - target: 8000
        published: "6179"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.00"
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/kitchen-board/icon.png
    x-casaos:
      id: com.icestore.kitchen-board
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS time zone.
              Leave it unless you need another.
        - container: ADMIN_EMAIL
          description:
            en_US: >-
              The email you sign in with as the first admin. Replace
              CHANGEME@example.com with your own. Only used on the very first
              start.
        - container: ADMIN_PASSWORD
          description:
            en_US: >-
              Optional. The first admin's password, at least 8 characters.
              Leave it empty and Kitchen Board makes one and prints it in the
              app log on the line with "Password:". Only used on the very
              first start.
      ports:
        - container: "8000"
          description:
            en_US: Kitchen Board web app, published on host as 6179
      volumes:
        - container: /data
          description:
            en_US: >-
              The SQLite database (kitchenboard.db), nightly backups,
              uploaded photos and .secret_key, this install's own sign-in key
              made on first start. Back this folder up.

x-casaos:

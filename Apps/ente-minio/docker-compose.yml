name: ente-minio

services:
  ente-minio:
    image: ghcr.io/hsinghhira/ente-minio:latest
    container_name: ente-minio
    restart: unless-stopped
    stop_grace_period: 90s
    privileged: true
    environment:
      - TZ=$TZ
      - PUBLIC_URL=http://localhost:6630
      - ENTE_API_URL=
      - ENTE_S3_URL=
      - ENTE_APPS_PUBLIC_ALBUMS=
      - ENTE_APPS_ACCOUNTS=
      - ENTE_APPS_CAST=
      - ENTE_APPS_PUBLIC_LOCKER=
      - ENTE_APPS_EMBED_ALBUMS=
      - ENTE_APPS_PUBLIC_PASTE=
      - ENTE_APPS_PUBLIC_MEMORIES=
    ports:
      - target: 8080
        published: "6630"
        protocol: tcp
      - target: 8081
        published: "6631"
        protocol: tcp
      - target: 8082
        published: "6632"
        protocol: tcp
      - target: 8083
        published: "6633"
        protocol: tcp
      - target: 8104
        published: "6634"
        protocol: tcp
      - target: 8105
        published: "6635"
        protocol: tcp
      - target: 8106
        published: "6636"
        protocol: tcp
      - target: 8107
        published: "6637"
        protocol: tcp
      - target: 8108
        published: "6638"
        protocol: tcp
      - target: 8109
        published: "6639"
        protocol: tcp
      - target: 8110
        published: "6640"
        protocol: tcp
      - target: 8111
        published: "6641"
        protocol: tcp
      - target: 8112
        published: "6642"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3072M
        reservations:
          cpus: "0.25"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-minio/icon.png
    x-casaos:
      id: com.icestore.ente-minio
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS time zone.
              Leave it unless you need another.
        - container: PUBLIC_URL
          description:
            en_US: >-
              The address of the Web App, like
              http://your-zimaos-ip:6630. Change localhost to your ZimaOS
              IP, or phones and other computers cannot use Ente. The other
              apps use the same address with the next ports: 6631 API,
              6632 Public Albums, 6633 photo storage, 6634 mail viewer,
              and 6635 to 6642 for Accounts, Auth, Cast, Public Locker,
              Embed, Paste, Locker and Public Memories. If PUBLIC_URL is your own
              domain with no port, like https://photos.example.com, set
              ENTE_API_URL, ENTE_S3_URL and the other addresses below too,
              or uploads, Locker and shared links will not work.
        - container: ENTE_API_URL
          description:
            en_US: >-
              The API address (the server address for the phone and desktop apps, and for every web app). Leave it blank to use PUBLIC_URL's host with
              port 6631. If you use your own domain, set it, like
              https://api.example.com.
        - container: ENTE_S3_URL
          description:
            en_US: >-
              The photo storage address. Phones, browsers and the Ente server upload here, so it must be reachable from all of them. Leave it blank to use PUBLIC_URL's host with
              port 6633. If you use your own domain, set it, like
              https://s3.example.com.
        - container: ENTE_APPS_PUBLIC_ALBUMS
          description:
            en_US: >-
              The Public Albums address for shared album links. Leave it blank to use PUBLIC_URL's host with
              port 6632. If you use your own domain, set it, like
              https://albums.example.com.
        - container: ENTE_APPS_ACCOUNTS
          description:
            en_US: >-
              The Accounts app address (passkeys, family invites). Leave it blank to use PUBLIC_URL's host with
              port 6635. If you use your own domain, set it, like
              https://accounts.example.com.
        - container: ENTE_APPS_CAST
          description:
            en_US: >-
              The Cast app address. Leave it blank to use PUBLIC_URL's host with
              port 6637. If you use your own domain, set it, like
              https://cast.example.com.
        - container: ENTE_APPS_PUBLIC_LOCKER
          description:
            en_US: >-
              The Public Locker address for shared Locker links. Leave it blank to use PUBLIC_URL's host with
              port 6638. If you use your own domain, set it, like
              https://share.example.com.
        - container: ENTE_APPS_EMBED_ALBUMS
          description:
            en_US: >-
              The Embed app address. Leave it blank to use PUBLIC_URL's host with
              port 6639. If you use your own domain, set it, like
              https://embed.example.com.
        - container: ENTE_APPS_PUBLIC_PASTE
          description:
            en_US: >-
              The Ente Paste address. Leave it blank to use PUBLIC_URL's host with
              port 6640. If you use your own domain, set it, like
              https://paste.example.com.
        - container: ENTE_APPS_PUBLIC_MEMORIES
          description:
            en_US: >-
              The Public Memories address for shared memories. Leave it blank to use PUBLIC_URL's host with
              port 6642. If you use your own domain, set it, like
              https://memories.example.com.
      ports:
        - container: "8080"
          description:
            en_US: Web App (Ente Photos), published on host as 6630
        - container: "8081"
          description:
            en_US: Ente API - the server address for the phone and desktop apps, published on host as 6631
        - container: "8082"
          description:
            en_US: Public Albums (shared album links), published on host as 6632
        - container: "8083"
          description:
            en_US: >-
              Photo storage (Silo S3). Phones and browsers upload and
              download your encrypted files here, published on host as 6633
        - container: "8104"
          description:
            en_US: Mail viewer for sign-up codes and other Ente emails, published on host as 6634
        - container: "8105"
          description:
            en_US: Accounts app (passkeys and family invites), published on host as 6635
        - container: "8106"
          description:
            en_US: Ente Auth web app (your two-factor codes), published on host as 6636
        - container: "8107"
          description:
            en_US: Cast app (show albums on a TV), published on host as 6637
        - container: "8108"
          description:
            en_US: Public Locker (shared Locker links), published on host as 6638
        - container: "8109"
          description:
            en_US: Embed app (albums inside other web pages), published on host as 6639
        - container: "8110"
          description:
            en_US: Ente Paste (share text that deletes itself), published on host as 6640
        - container: "8111"
          description:
            en_US: Ente Locker web app (store important documents), published on host as 6641
        - container: "8112"
          description:
            en_US: Public Memories (shared memory links), published on host as 6642
      volumes:
        - container: /data
          description:
            en_US: >-
              Your encrypted photos and videos (Silo), the database,
              secret keys and settings.

x-casaos:
  id: com.icestore.ente-minio
  architectures:
    - amd64
    - arm64
  main: ente-minio
  author: HSinghHira
  category: Media
  developer: ente-io
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-minio/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-minio/screenshot-1.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-minio/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-minio/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-minio/screenshot-3.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-minio/screenshot-4.png
  title:
    en_US: Ente - MinIO S3
  tagline:
    en_US: End-to-end encrypted photo storage, with Silo for the files
  description:
    en_US: >-
      Ente is a self-hosted, end-to-end encrypted place to store, share and
      rediscover your photos and videos on all your devices. This is Ente in
      a single container, with PostgreSQL, Silo, the community fork of MinIO that is still open source, and a mail viewer
      for sign-up codes inside. Secret keys and passwords are made for you on
      first start.


      **Features**


      - End-to-end encryption for every photo and video


      - All ten Ente web apps, each on its own port: Photos, Public
        Albums, Accounts, Auth, Cast, Locker, Public Locker, Embed,
        Paste and Public Memories


      - Works with the Ente phone and desktop apps


      - Silo (the open-source fork of MinIO) for S3-compatible photo storage


      - Built-in mail viewer on port 6634 for sign-up codes, or use your
        own email server


      - No 10 GB limit: every account gets 100 TB by default


      **How to use?**

      1. Open Ente - MinIO S3 from the Zima OS dashboard.

      2. Sign up with your email and a password.

      3. Open the mail viewer on port 6634 to read your sign-up code.

      4. Type the code to finish signing up.

      5. In the Ente phone app, tap the first screen 7 times and set the
         server to http://your-zimaos-ip:6631.

      6. Upload photos and share albums.
  tips:
    before_install:
      en_US: >-
        1. Open the app configuration before you install.


        2. Find PUBLIC_URL. Change localhost to your ZimaOS IP, for example
           http://192.168.1.20:6630 (your own IP will differ). Phones
           cannot use localhost.


        3. More settings, like your own email server and sign-up, are listed
           on the Ente - MinIO S3 page at
           https://icestore.hsinghhira.me/app/ente-minio/ (Variables tab). You
           can add them now or later in the app settings.


        4. Using your own domain? Put each app behind its own address in
           your reverse proxy, then fill in ENTE_API_URL, ENTE_S3_URL and
           the other ENTE_APPS addresses. Photo storage needs its own
           address, or uploads fail.


        5. Start the installation.


        6. Wait about three minutes. The first start sets up the database.


        7. Open the app logs and scroll to the top. Find the line that says
           "mail viewer login". Write down the password.


        8. Open http://your-zimaos-ip:6630 in your browser. Sign up with
           your email and a password.


        9. Open http://your-zimaos-ip:6634 in a new tab. Sign in
           as admin with the mail password. Copy the code from the email.


        10. Type the code in Ente to finish signing up.


        11. For the phone app: tap the first screen 7 times. Set the server
            to http://your-zimaos-ip:6631 and sign in.
  index: /
  port_map: "6630"
  scheme: http
  is_uncontrolled: false
  version: "20fb631"
  update_at: "2026-10-27"
  release_notes:
    en_US: |-
      - Every address (ENTE_API_URL, ENTE_S3_URL, ENTE_APPS_*) is now in the app settings, for people
        who use their own domain; the log warns when PUBLIC_URL has no port and they are blank
      - New ports: 6630 Web App, 6631 API, 6632 Public Albums, 6633 photo storage,
        6634 mail viewer, 6635-6642 the other web apps
      - Adds the Accounts (passkeys), Auth, Cast, Public Locker, Embed, Paste, Locker
        and Public Memories apps, and tells the Ente server where each one is
      - Mail viewer has its own port; /mail/ on the Web App still works
      - Old installs on 6129-6132 keep working: every address counts up from
        PUBLIC_URL's port. Reinstall to get the new apps' ports
      - New settings ENTE_APPS_* (Ente's own names); ENTE_ALBUMS_URL still works
      - Single-container Ente with Silo storage and one data folder
      - Database, storage and museum keys are made on first start, so each install gets its own
      - Sign-up codes go to the built-in mail viewer unless you set your own email server
      - Every account gets 100 TB instead of Ente's 10 GB (ENTE_AIO_STORAGE_GB)
      - server 20fb631, web 817ce84 (Ente only publishes commit tags; they follow latest)
      - silo RELEASE.2026-10-18T00-00-00Z, mailpit v1.32.0, PostgreSQL 15
  repo: "https://github.com/ente/ente"
  support: "https://github.com/ente/ente/issues"
  docs: "https://ente.com/help/self-hosting/"

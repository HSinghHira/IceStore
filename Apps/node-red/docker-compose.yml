name: node-red

services:
  node-red:
    image: nodered/node-red:5.0.10
    container_name: node-red
    user: "0:0"
    restart: unless-stopped
    network_mode: bridge
    environment:
      - TZ=$TZ
    ports:
      - target: 1880
        published: "6822"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "node", "/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/node-red/icon.png
    x-casaos:
      id: com.icestore.node-red
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone, for timers and schedules. It is
              filled in from your ZimaOS time zone.
      ports:
        - container: "1880"
          description:
            en_US: >-
              Node-RED editor, dashboards and HTTP endpoints,
              published on host as 6822
      volumes:
        - container: /data
          description:
            en_US: >-
              Your flows, credentials (flows_cred.json),
              installed nodes and settings.js. Back it up.

x-casaos:
  id: com.icestore.node-red
  architectures:
    - amd64
    - arm64
  main: node-red
  author: HSinghHira
  category: Home
  developer: "OpenJS Foundation"
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/node-red/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/node-red/screenshot-1.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/node-red/screenshot-1.png
  title:
    en_US: Node-RED
  tagline:
    en_US: Low-code tool for wiring together devices, APIs and online services
  description:
    en_US: >-
      Visit: [https://icestore.hsinghhira.me/app/node-red/](https://icestore.hsinghhira.me/app/node-red/) for full details


      Node-RED lets you build automations by dragging nodes onto a
      canvas and wiring them together. Connect smart-home devices, MQTT,
      web APIs, databases and messages, and react to events without
      writing a whole program.


      **Features**


      - Browser-based flow editor with hundreds of built-in nodes

      - Over 5,000 community nodes, installed from the Palette Manager

      - MQTT, HTTP, WebSocket, TCP, UDP, files, timers and JavaScript
        functions

      - Home Assistant, Zigbee2MQTT and many more through community
        nodes

      - Dashboards and your own HTTP endpoints

      - Projects with Git, and import or export flows as JSON


      **How to use?**


      1. Open Node-RED.

      2. Drag nodes from the left onto the canvas, wire them and press
         Deploy.

      3. Add more nodes with the menu, Manage palette.
  tips:
    before_install:
      en_US: >-
        1. Start the installation. It is ready in about half a minute.


        2. Node-RED has no login at first, so anyone on your network
           can change your flows. Add one in settings.js (adminAuth)
           in /DATA/AppData/node-red/data, then restart the app.


        3. Set NODE_RED_CREDENTIAL_SECRET in the app settings to
           encrypt the passwords your flows save.
  index: /
  port_map: "6822"
  scheme: http
  is_uncontrolled: false
  version: "5.0.10"
  update_at: "2026-11-25"
  release_notes:
    en_US: |-
      - First IceStore release: nodered/node-red 5.0.10 on port 6822
      - Runs as root so it can write its ZimaOS data folder
  repo: "https://github.com/node-red/node-red"
  support: "https://github.com/node-red/node-red/issues"
  docs: "https://nodered.org/docs/"

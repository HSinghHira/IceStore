name: upsnap

services:
  upsnap:
    image: ghcr.io/seriousm4x/upsnap:5.7.3
    container_name: upsnap
    restart: unless-stopped
    stop_grace_period: 10s
    network_mode: host
    cap_add:
      - NET_RAW
    command: ["serve", "--http", "0.0.0.0:6894"]
    environment:
      - TZ=$TZ
      - UPSNAP_INTERVAL=*/10 * * * * *
      - UPSNAP_SCAN_RANGE=
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/pb_data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:6894/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 16M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/upsnap/icon.png
    x-casaos:
      id: com.icestore.upsnap
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone, for scheduled wake and shutdown
              times. It is filled in from your ZimaOS time zone.
        - container: UPSNAP_INTERVAL
          description:
            en_US: >-
              How often UpSnap checks which devices are on, as a
              cron line with seconds, like */10 * * * * * for every 10 seconds.
        - container: UPSNAP_SCAN_RANGE
          description:
            en_US: >-
              Your home network for the device scan, like
              192.168.1.0/24. Leave blank to skip scanning and add
              devices by hand.
      ports:
        - container: "6894"
          description:
            en_US: >-
              UpSnap web app on port 6894 (host network, so Wake on
              LAN packets reach your devices)
      volumes:
        - container: /app/pb_data
          description:
            en_US: >-
              UpSnap's database with your devices, users and
              schedules. Back it up.

x-casaos:
  id: com.icestore.upsnap
  architectures:
    - amd64
    - arm64
  main: upsnap
  author: HSinghHira
  category: Networking
  developer: "seriousm4x"
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/upsnap/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/upsnap/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/upsnap/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/upsnap/screenshot-3.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/upsnap/screenshot-1.png
  title:
    en_US: UpSnap
  tagline:
    en_US: Wake your computers with one click from a simple dashboard
  description:
    en_US: >-
      Visit: [https://icestore.hsinghhira.me/app/upsnap/](https://icestore.hsinghhira.me/app/upsnap/) for full details


      UpSnap is a Wake on LAN dashboard. It shows which of your devices
      are on, wakes them with one click, and can turn them off or wake
      them on a schedule.


      **Features**


      - One-click Wake on LAN for each device

      - Live on/off status and open ports

      - Scheduled wake and shutdown with cron

      - Network scan to find devices

      - Users with their own permissions, and 30+ languages


      **How to use?**


      1. Open UpSnap and make the admin account.

      2. Add a device with its IP and MAC address, or set
         UPSNAP_SCAN_RANGE and scan your network.

      3. Click a device to wake it.
  tips:
    before_install:
      en_US: >-
        1. Start the installation. UpSnap is ready in a few seconds.


        2. Open it right away and make the admin account. The first
           person to open it gets admin.


        3. Each computer you want to wake must have Wake on LAN turned on
           in its BIOS and network settings.
  index: /
  port_map: "6894"
  scheme: http
  is_uncontrolled: false
  version: "5.7.3"
  update_at: "2026-11-28"
  release_notes:
    en_US: |-
      - First IceStore release: ghcr.io/seriousm4x/upsnap 5.7.3 on port 6894 (host network)
  repo: "https://github.com/seriousm4x/UpSnap"
  support: "https://github.com/seriousm4x/UpSnap/issues"
  docs: "https://github.com/seriousm4x/UpSnap/wiki"

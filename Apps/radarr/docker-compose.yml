name: radarr

services:
  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    container_name: radarr
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: bridge
    environment:
      - TZ=$TZ
      - PUID=$PUID
      - PGID=$PGID
    ports:
      - target: 7878
        published: "6828"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
        bind:
          create_host_path: true
      - type: bind
        source: /DATA
        target: /DATA
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/radarr/icon.png
    x-casaos:
      id: com.icestore.radarr
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone, for schedules and the calendar. It
              is filled in from your ZimaOS time zone.
        - container: PUID
          description:
            en_US: >-
              The user that owns your media files. It is filled
              in by ZimaOS.
        - container: PGID
          description:
            en_US: >-
              The group that owns your media files. It is filled
              in by ZimaOS.
      ports:
        - container: "7878"
          description:
            en_US: >-
              Radarr web app and API, published on host as 6828
      volumes:
        - container: /config
          description:
            en_US: >-
              Radarr's database, settings, API key and logs.
              Back it up.
        - container: /DATA
          description:
            en_US: >-
              Your ZimaOS storage at the same path, so Radarr
              sees your downloads folder and your library (like
              /DATA/Media/Movies) and can move files without
              copying.

x-casaos:
  id: com.icestore.radarr
  architectures:
    - amd64
    - arm64
  main: radarr
  author: HSinghHira
  category: Media
  developer: "Radarr team"
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/radarr/icon.png
  title:
    en_US: Radarr
  tagline:
    en_US: Finds, downloads and organizes your movies automatically
  description:
    en_US: >-
      Visit: [https://icestore.hsinghhira.me/app/radarr/](https://icestore.hsinghhira.me/app/radarr/) for full details


      Radarr keeps track of the movies you want, grabs them through your
      Usenet or BitTorrent client when they come out, then renames and
      files them into your library for Jellyfin, Plex or Emby.


      **Features**


      - Movie list with release calendar and automatic search

      - Quality profiles, custom formats and upgrades

      - Works with qBittorrent, Transmission, SABnzbd, NZBGet and more

      - Lists from Trakt, IMDb, Letterboxd and more

      - Renames and organizes files, and tells your media server to
        refresh


      **How to use?**


      1. Open Radarr right away and set up the login it asks for (Forms
         login).

      2. In Settings, Media Management, add your root folder, like
         /DATA/Media/Movies.

      3. Add your download client and indexers (or connect Prowlarr),
         then add what you want.
  tips:
    before_install:
      en_US: >-
        1. Start the installation. It is ready in about a minute.


        2. Right away, open Radarr. It asks you to choose how to sign
           in; pick Forms and set a user name and password.


        3. Your ZimaOS storage is at /DATA inside the app. Use the
           same /DATA paths in your download client so Radarr can find
           finished downloads.
  index: /
  port_map: "6828"
  scheme: http
  is_uncontrolled: false
  version: "7.0.3.10918-ls328"
  update_at: "2026-11-25"
  release_notes:
    en_US: |-
      - First IceStore release: lscr.io/linuxserver/radarr 7.0.3.10918-ls328 on port 6828
      - /DATA is shared at the same path, so downloads can be moved into your library without copying
  repo: "https://github.com/Radarr/Radarr"
  support: "https://github.com/Radarr/Radarr/issues"
  docs: "https://wiki.servarr.com/radarr"

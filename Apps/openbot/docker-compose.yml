name: openbot

services:
  openbot:
    image: ghcr.io/hsinghhira/openbot:latest
    container_name: openbot
    restart: unless-stopped
    stop_grace_period: 60s
    network_mode: bridge
    environment:
      - TZ=$TZ
      - OPENBOT_SETUP_PAGE_PORT=8080
    ports:
      - target: 8080
        published: "6873"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    shm_size: 1g
    security_opt:
      - seccomp:unconfined
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/openbot/icon.png
    x-casaos:
      id: com.icestore.openbot
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone, for agent routines. It is filled
              in from your ZimaOS time zone.
        - container: OPENBOT_SETUP_PAGE_PORT
          description:
            en_US: >-
              The port of the sign-in and setup page inside the
              container. Leave it as 8080.
      ports:
        - container: "8080"
          description:
            en_US: >-
              OpenBot sign-in and setup page, published on host
              as 6873
      volumes:
        - container: /data
          description:
            en_US: >-
              Everything OpenBot keeps: the server's sign-in,
              agents, their workspaces, conversations, memory
              and installed tools (like Hermes Agent). Back it
              up.

x-casaos:
  id: com.icestore.openbot
  architectures:
    - amd64
    - arm64
  main: openbot
  author: HSinghHira
  category: AI
  developer: "Synthetify Labs"
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/openbot/icon.png
  title:
    en_US: OpenBot
  tagline:
    en_US: A server for your AI agents that keeps working when your computer is off
  description:
    en_US: >-
      Visit: [https://icestore.hsinghhira.me/app/openbot/](https://icestore.hsinghhira.me/app/openbot/) for full details


      OpenBot runs your AI agents on your ZimaOS. Each agent has its own
      workspace, conversation and memory, can use a browser and a
      virtual display, and keeps working when your computer is off. You
      use the server from the OpenBot desktop app, the phone app or
      openbot.run/app.


      **Features**


      - Persistent agents that keep their workspace, conversation and
        identity across restarts

      - Many providers, like Claude Code, Codex, Gemini, OpenCode and
        Hermes Agent

      - Browser and computer use in the app's sandbox

      - Channels where several agents work in one room

      - Routines that run on a schedule, and teams that share the server


      **How to use?**


      1. Open OpenBot on your ZimaOS and sign in with your OpenBot
         account (email and code).

      2. Open the OpenBot app or openbot.run/app with the same account
         and pick this server.

      3. Connect a provider on the server, then create your first agent.
  tips:
    before_install:
      en_US: >-
        1. Start the installation. It is ready in about a minute.


        2. Open OpenBot from your ZimaOS dashboard and sign in with
           your OpenBot account. You get a code by email.


        3. Then use the OpenBot app or openbot.run/app with the same
           account and choose this server. Connect an AI provider on
           the server itself; the one on your laptop does not carry
           over.


        4. Agents run commands and keep files inside this app only.
           They do not see your ZimaOS files.
  index: /
  port_map: "6873"
  scheme: http
  is_uncontrolled: false
  version: "0.80.0"
  update_at: "2026-11-27"
  release_notes:
    en_US: |-
      - Updated openbot 0.79.0 to 0.80.0
      - Updated openbot 0.78.0 to 0.79.0
      - First IceStore release: ghcr.io/nightly-labs/openbot 0.80.0 with its sign-in page on port 6873
      - A start script gives the data folder to OpenBot's own user (uid 1000) and starts it as that user, like upstream's Umbrel app
      - Runs with seccomp unconfined instead of upstream's seccomp.json, which a store app cannot ship; the Electron sandbox needs those calls
  repo: "https://github.com/nightly-labs/openbot"
  support: "https://github.com/nightly-labs/openbot/issues"
  docs: "https://openbot.run/guides/install-openbot-vps"

name: penpot

services:
  penpot:
    image: ghcr.io/hsinghhira/penpot:latest
    container_name: penpot
    restart: unless-stopped
    stop_grace_period: 90s
    privileged: true
    environment:
      - TZ=$TZ
      - PUBLIC_URL=http://[ZIMAOS-IP-ADDRESS]:6751
    ports:
      - target: 8080
        published: "6751"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus: "4.00"
          memory: 4096M
        reservations:
          cpus: "0.50"
          memory: 1024M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/penpot/icon.png
    x-casaos:
      id: com.icestore.penpot
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS time zone.
              Leave it unless you need another.
        - container: PUBLIC_URL
          description:
            en_US: >-
              Required. Replace [ZIMAOS-IP-ADDRESS] with your ZimaOS IP, like
              http://192.168.1.20:6751. It must be the exact address you open
              Penpot at; images, exports and sign-in use it. Behind a domain,
              use that instead, like https://design.example.com.
      ports:
        - container: "8080"
          description:
            en_US: Penpot web app, API and mail viewer (/mail), published on host as 6751
      volumes:
        - container: /data
          description:
            en_US: >-
              The PostgreSQL database with every design, assets/ with the
              uploaded images and fonts, and state/secrets.env, this
              install's own keys made on first start. Back it up.

x-casaos:
  id: com.icestore.penpot
  architectures:
    - amd64
    - arm64
  main: penpot
  author: HSinghHira
  category: Developer
  developer: Kaleidos
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/penpot/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/penpot/screenshot-1.webp
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/penpot/screenshot-1.webp
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/penpot/screenshot-2.webp
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/penpot/screenshot-3.webp
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/penpot/screenshot-4.webp
  title:
    en_US: Penpot
  tagline:
    en_US: Design and prototyping for teams, an open-source Figma alternative
  description:
    en_US: >-
      Penpot is a design and prototyping tool that runs in your browser and
      works with open standards like SVG, CSS and HTML. Designers and
      developers work in the same files at the same time. PostgreSQL, Redis,
      the exporter and a mail viewer are built in, so it is one container.


      **Features**


      - Vector design, components, variants and design tokens

      - Flex and grid layouts that match how CSS works

      - Interactive prototypes with flows and transitions

      - Real-time teamwork with comments and version history

      - Inspect mode with ready-to-copy CSS, SVG and HTML

      - Exports to PNG, JPG, SVG and PDF, plus plugins and an API


      **How to use?**


      1. Set PUBLIC_URL to http://[ZIMAOS-IP-ADDRESS]:6751 with your ZimaOS
         IP before you install.

      2. Open Penpot and choose Create an account. The first account is
         yours.

      3. Start a new project and a new file from the dashboard.

      4. Invite your team from the team settings. Invitation emails show up
         in the mail viewer at /mail until you set an email server.

      5. Use View mode to share prototypes and Inspect mode to hand designs
         to developers.


      Left out: the admin console and the MCP server.
  tips:
    before_install:
      en_US: >-
        1. You must do this first, or images and exports won't work. Find
           PUBLIC_URL in the settings. It says
           http://[ZIMAOS-IP-ADDRESS]:6751 now.


        2. Replace [ZIMAOS-IP-ADDRESS] with your ZimaOS IP. For example
           http://192.168.1.20:6751 is right.


        3. More settings, like your own email server and sign-in with
           Google, GitHub or OIDC, are listed on the Penpot page at
           https://icestore.hsinghhira.me/app/penpot/ (Variables tab). You
           can add them now or later in the app settings.


        4. Start the installation. The first start takes about 5 minutes.


        5. Open your PUBLIC_URL address. Choose Create an account and make
           your account.


        6. Emails go to the mail viewer at
           http://[ZIMAOS-IP-ADDRESS]:6751/mail/ until you set an email
           server. Its login is in the app's logs, in the box marked
           CREDENTIALS.
  index: /
  port_map: "6751"
  scheme: http
  is_uncontrolled: false
  version: "2.19.3"
  update_at: "2026-11-20"
  release_notes:
    en_US: |-
      - First IceStore release, on port 6751
      - All in one container: penpotapp/backend 2.19.3, penpotapp/exporter 2.19.3, penpotapp/frontend 2.19.3, axllent/mailpit v1.34.0, PostgreSQL 15, Redis and an nginx gateway
      - Each install makes its own PENPOT_SECRET_KEY and database password on first start
      - The admin console and the MCP server are left out
  repo: "https://github.com/penpot/penpot"
  support: "https://github.com/penpot/penpot/issues"
  docs: "https://help.penpot.app/technical-guide/"

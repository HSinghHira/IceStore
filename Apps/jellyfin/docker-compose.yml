name: jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: bridge
    environment:
      - TZ=$TZ
    ports:
      - target: 8096
        published: "6798"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/cache
        target: /cache
        bind:
          create_host_path: true
      - type: bind
        source: /DATA
        target: /DATA
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4.00"
          memory: 4G
        reservations:
          cpus: "0.10"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/jellyfin/icon.png
    x-casaos:
      id: com.icestore.jellyfin
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS time zone.
      ports:
        - container: "8096"
          description:
            en_US: Jellyfin web app and the address for Jellyfin apps, published on host as 6798
      volumes:
        - container: /config
          description:
            en_US: >-
              Jellyfin's settings, users, watch history and library
              database. Back it up.
        - container: /cache
          description:
            en_US: >-
              Images and transcoding scratch files. Safe to delete.
        - container: /DATA
          description:
            en_US: >-
              Your ZimaOS storage, at the same path inside, so libraries can
              point at folders like /DATA/Media/Movies.

x-casaos:
  id: com.icestore.jellyfin
  architectures:
    - amd64
    - arm64
  main: jellyfin
  author: HSinghHira
  category: Media
  developer: Jellyfin
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/jellyfin/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/jellyfin/screenshot-1.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/jellyfin/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/jellyfin/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/jellyfin/screenshot-3.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/jellyfin/screenshot-4.png
  title:
    en_US: Jellyfin
  tagline:
    en_US: Stream your own movies, shows and music to every screen
  description:
    en_US: >-
      Jellyfin is a free media server. Point it at your movies, TV shows,
      music and photos, and it fetches posters and details, then streams
      them to your TV, phone, browser or game console. No account with
      anyone else, no tracking, no paid tier.


      **Features**


      - Movies, shows, music, books and photos in tidy libraries

      - Apps for Android, iOS, Android TV, Fire TV, Roku, Kodi and more

      - Converts video on the fly when a device can't play the file

      - Users with parental controls and their own watch history

      - Live TV and DVR with a tuner

      - Plugins, subtitles and SyncPlay to watch together


      **How to use?**


      1. Open Jellyfin from the ZimaOS dashboard.

      2. Follow the setup wizard and make your admin user.

      3. Add a library and pick a folder under /DATA, like
         /DATA/Media/Movies.

      4. Wait for the scan, then press play.
  tips:
    before_install:
      en_US: >-
        1. Start the installation. It is ready in about a minute.


        2. Right away, open http://[ZIMAOS-IP-ADDRESS]:6798 and follow the
           setup wizard. It makes your admin user. Until you do, anyone on
           your network can.


        3. When you add a library, pick a folder that starts with /DATA, like
           /DATA/Media/Movies.


        4. In the Jellyfin apps on your TV or phone, use
           http://[ZIMAOS-IP-ADDRESS]:6798 as the server.
  index: /
  port_map: "6798"
  scheme: http
  is_uncontrolled: false
  version: "10.11.11"
  update_at: "2026-11-22"
  release_notes:
    en_US: |-
      - First IceStore release, on port 6798
      - The official jellyfin/jellyfin 10.11.11 image; /DATA is shared at the same path for your media
      - Hardware transcoding (/dev/dri) is not passed in, so video converts on the CPU
  repo: "https://github.com/jellyfin/jellyfin"
  support: "https://github.com/jellyfin/jellyfin/issues"
  docs: "https://jellyfin.org/docs/"

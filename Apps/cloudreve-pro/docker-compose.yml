name: cloudreve-pro

services:
  cloudreve-pro:
    image: ghcr.io/hsinghhira/cloudreve-pro:latest
    container_name: cloudreve-pro
    restart: unless-stopped
    stop_grace_period: 90s
    privileged: true
    environment:
      - TZ=$TZ
      - PUBLIC_URL=http://localhost:6127
    ports:
      - target: 8080
        published: "6127"
        protocol: tcp
      - target: 6888
        published: "6128"
        protocol: tcp
      - target: 6888
        published: "6128"
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/v4/site/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.25"
          memory: 384M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/cloudreve-pro/icon.png
    x-casaos:
      id: com.icestore.cloudreve-pro
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS time zone.
              Leave it unless you need another.
        - container: PUBLIC_URL
          description:
            en_US: >-
              The address you open Cloudreve Pro at, like
              http://your-zimaos-ip:6127. Share links, WebDAV and emails use
              it. Change localhost to your ZimaOS IP, or to your own domain if
              you put Cloudreve Pro behind HTTPS. Only used on the first start;
              change it later in the admin panel (Settings, Site URL).
      ports:
        - container: "8080"
          description:
            en_US: Cloudreve Pro web app, API and WebDAV, published on host as 6127
        - container: "6888"
          description:
            en_US: >-
              aria2 BitTorrent and DHT port (tcp and udp), published on host as
              6128. Only used for remote downloads.
      volumes:
        - container: /data
          description:
            en_US: >-
              The database, Redis, uploaded files (Local storage policy),
              avatars, thumbnails, conf.ini and settings.

x-casaos:
  id: com.icestore.cloudreve-pro
  architectures:
    - amd64
    - arm64
  main: cloudreve-pro
  author: HSinghHira
  category: Productivity
  developer: Dvorinka
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/cloudreve-pro/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/cloudreve-pro/screenshot-1.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/cloudreve-pro/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/cloudreve-pro/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/cloudreve-pro/screenshot-3.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/cloudreve-pro/screenshot-4.png
  title:
    en_US: Cloudreve Pro
  tagline:
    en_US: Self-hosted file management and cloud storage, with the Pro features for free
  description:
    en_US: >-
      Cloudreve Pro is the Dvorinka community fork of Cloudreve - a private Dropbox or Google Drive that you fully control, with the Pro-class features (OIDC sign-in, share collaboration, drop boxes, yt-dlp downloads) rebuilt as free software. It runs side by side with the regular Cloudreve app.
      This is Cloudreve Pro in a single container, with PostgreSQL and Redis inside,
      one web port and one data folder.


      **Features**


      - Drag-and-drop uploads, previews in the browser, and share links
        with passwords and expiry dates

      - WebDAV, to use Cloudreve Pro as a network drive on Windows, macOS or Linux

      - Many storage backends - Local, S3-compatible (MinIO, Backblaze B2,
        Cloudflare R2, AWS S3), OneDrive and more - set per user group

      - Remote downloads with the built-in aria2, straight to your storage

      - Thumbnails for photos, videos and Office files (ffmpeg, libvips,
        LibreOffice and libraw are included)

      - PostgreSQL and Redis inside, with nothing to set up


      **How to use?**

      1. Open Cloudreve Pro from the Zima OS dashboard.

      2. Create an account. The first account becomes the admin.

      3. Upload files and make folders.

      4. Open the admin panel to add other storage, user groups and sharing
         rules.

      5. Turn on WebDAV in your user settings to use it as a network drive.
  tips:
    before_install:
      en_US: >-
        1. Open the app configuration before you install.


        2. Find PUBLIC_URL. Change localhost to your ZimaOS IP, for example
           http://192.168.1.20:6127 (your own IP will differ).


        3. More settings, like the site name and sign-up, are listed on the
           Cloudreve Pro page at https://icestore.hsinghhira.me/app/cloudreve-pro/
           (Variables tab). You can add them now or later in the app settings.


        4. Start the installation.


        5. Wait about one minute. The first start sets up the database.


        6. Open http://your-zimaos-ip:6127 in your browser.


        7. Click sign up and create your account. The first account becomes
           the admin, so make yours before anyone else.


        8. All other settings are in the admin panel in the app.
  index: /
  port_map: "6127"
  scheme: http
  is_uncontrolled: false
  version: "v4.23.4"
  update_at: "2026-10-23"
  release_notes:
    en_US: |-
      - Single-container Cloudreve Pro with one web port (6127), the aria2 port (6128) and one data folder
      - ghcr.io/dvorinka/cloudreve v4.23.4
      - PostgreSQL 17 and Redis inside, on 127.0.0.1 only, with no passwords to set
  repo: "https://github.com/Dvorinka/cloudreve"
  support: "https://github.com/Dvorinka/cloudreve/issues"
  docs: "https://docs.cloudreve.org/"

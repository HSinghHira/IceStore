name: flatnotes

services:
  flatnotes:
    image: ghcr.io/hsinghhira/flatnotes:latest
    container_name: flatnotes
    restart: unless-stopped
    network_mode: bridge
    environment:
      - TZ=$TZ
      - PUID=$PUID
      - PGID=$PGID
      - FLATNOTES_USERNAME=admin
    ports:
      - target: 8080
        published: "6871"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 32M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/flatnotes/icon.png
    x-casaos:
      id: com.icestore.flatnotes
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS
              time zone.
        - container: PUID
          description:
            en_US: >-
              The user that owns your note files. It is filled
              in by ZimaOS.
        - container: PGID
          description:
            en_US: >-
              The group that owns your note files. It is filled
              in by ZimaOS.
        - container: FLATNOTES_USERNAME
          description:
            en_US: >-
              The user name you sign in with. The password is
              shown in the app's logs, in the box marked
              CREDENTIALS.
      ports:
        - container: "8080"
          description:
            en_US: >-
              flatnotes web app, published on host as 6871
      volumes:
        - container: /data
          description:
            en_US: >-
              Your notes as Markdown files, attachments, the
              search index and this install's password and
              secret key.

x-casaos:
  id: com.icestore.flatnotes
  architectures:
    - amd64
    - arm64
  main: flatnotes
  author: HSinghHira
  category: Productivity
  developer: "dullage"
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/flatnotes/icon.png
  title:
    en_US: flatnotes
  tagline:
    en_US: Simple note app that keeps your notes as plain Markdown files
  description:
    en_US: >-
      Visit: [https://icestore.hsinghhira.me/app/flatnotes/](https://icestore.hsinghhira.me/app/flatnotes/) for full details


      flatnotes is a calm, distraction-free note app. Every note is a
      Markdown file in one folder, with no database, so you can open,
      sync and back them up with any tool. Fast full-text search and
      tags help you find them again.


      **Features**


      - Notes saved as plain .md files in one folder

      - Rich or Markdown editor, with images and attachments

      - Full-text search, tags and wiki-style links

      - Dark mode and a clean, mobile-friendly page

      - Optional login with a password and two-factor codes


      **How to use?**


      1. Open flatnotes and sign in as admin with the password from the
         CREDENTIALS box in the app's logs.

      2. Press New Note and start writing.
  tips:
    before_install:
      en_US: >-
        1. Start the installation. It is ready in a few seconds.


        2. Open flatnotes. The user name is admin. The password is in
           the app's logs, in the box marked CREDENTIALS.
  index: /
  port_map: "6871"
  scheme: http
  is_uncontrolled: false
  version: "v5.5.5"
  update_at: "2026-11-25"
  release_notes:
    en_US: |-
      - First IceStore release: dullage/flatnotes v5.5.5, plus a start script that makes this install's password and secret key on first start
  repo: "https://github.com/dullage/flatnotes"
  support: "https://github.com/dullage/flatnotes/issues"
  docs: "https://github.com/dullage/flatnotes#readme"

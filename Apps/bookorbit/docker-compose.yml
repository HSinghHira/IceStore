name: bookorbit

services:
  bookorbit:
    image: ghcr.io/hsinghhira/bookorbit:latest
    container_name: bookorbit
    restart: unless-stopped
    stop_grace_period: 90s
    privileged: true
    environment:
      - TZ=$TZ
      - PUBLIC_URL=http://localhost:6124
    ports:
      - target: 8080
        published: "6124"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/books
        target: /books
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3072M
        reservations:
          cpus: "0.25"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/bookorbit/icon.png
    x-casaos:
      id: com.icestore.bookorbit
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS time zone.
              Leave it unless you need another.
        - container: PUBLIC_URL
          description:
            en_US: >-
              The address you open BookOrbit at, like
              http://your-zimaos-ip:6124. Links in emails, Kobo sync and OPDS
              use it. Change localhost to your ZimaOS IP, or to your own
              domain if you put BookOrbit behind HTTPS.
      ports:
        - container: "8080"
          description:
            en_US: BookOrbit web app, API, OPDS and Kobo/KOReader sync, published on host as 6124
      volumes:
        - container: /data
          description:
            en_US: >-
              The database, covers, cache, Book Dock, conversion files, secret
              keys and settings.
        - container: /books
          description:
            en_US: >-
              Your book files - EPUB, MOBI, AZW3, PDF, CBZ/CBR comics and
              M4B/MP3 audiobooks. Point it at your own books folder if you
              have one.


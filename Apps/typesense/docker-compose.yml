name: typesense

services:
  typesense:
    image: ghcr.io/hsinghhira/typesense:latest
    container_name: typesense
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: bridge
    environment:
      - TZ=$TZ
    ports:
      - target: 8108
        published: "6866"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/typesense/icon.png
    x-casaos:
      id: com.icestore.typesense
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS
              time zone.
      ports:
        - container: "8108"
          description:
            en_US: >-
              Typesense API, published on host as 6866
      volumes:
        - container: /data
          description:
            en_US: >-
              Your collections and documents, and this install's
              admin API key (.icestore-typesense-api-key). Back
              it up.

x-casaos:
  id: com.icestore.typesense
  architectures:
    - amd64
    - arm64
  main: typesense
  author: HSinghHira
  category: Developer
  developer: "Typesense"
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/typesense/icon.png
  title:
    en_US: Typesense
  tagline:
    en_US: Fast, typo-tolerant search engine API, an Algolia alternative
  description:
    en_US: >-
      Visit: [https://icestore.hsinghhira.me/app/typesense/](https://icestore.hsinghhira.me/app/typesense/) for full details


      Typesense is a search engine for your own apps and websites. Send
      it JSON documents and get instant, typo-tolerant results with
      filters, facets and geo search, plus vector and hybrid search for
      AI apps.


      **Features**


      - Search-as-you-type with typo tolerance and synonyms

      - Filters, facets, sorting, grouping and geo search

      - Vector, semantic and hybrid search, with built-in embedding
        models

      - Scoped API keys for safe searching from browsers

      - Client libraries for JavaScript, Python, PHP, Ruby, Go and more


      **How to use?**


      1. Copy the admin API key from the CREDENTIALS box in the app's
         logs.

      2. Point your app or client library at
         http://[ZIMAOS-IP-ADDRESS]:6866 with that key.
  tips:
    before_install:
      en_US: >-
        1. Start the installation. It is ready in a few seconds.


        2. Typesense has no web page. The admin API key is in the
           app's logs, in the box marked CREDENTIALS. Keep it private.


        3. Apps use it at your ZimaOS IP with port 6866, like
           http://192.168.1.20:6866 for the IP 192.168.1.20 (use
           yours).
  index: /health
  port_map: "6866"
  scheme: http
  is_uncontrolled: false
  version: "30.2"
  update_at: "2026-11-25"
  release_notes:
    en_US: |-
      - First IceStore release: typesense/typesense 30.2, plus a start script that makes this install's admin API key on first start
  repo: "https://github.com/typesense/typesense"
  support: "https://github.com/typesense/typesense/issues"
  docs: "https://typesense.org/docs/"

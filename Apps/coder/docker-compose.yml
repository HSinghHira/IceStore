name: coder

services:
  coder:
    image: ghcr.io/hsinghhira/coder:latest
    container_name: coder
    restart: unless-stopped
    stop_grace_period: 90s
    privileged: true
    environment:
      - TZ=$TZ
      - PUBLIC_URL=http://localhost:6145
    ports:
      - target: 8080
        published: "6145"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4096M
        reservations:
          cpus: "0.25"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/coder/icon.png
    x-casaos:
      id: com.icestore.coder
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS time zone.
              Leave it unless you need another.
        - container: PUBLIC_URL
          description:
            en_US: >-
              The address you open Coder at. Change localhost to your ZimaOS
              IP, like http://192.168.1.20:6145, or use your own HTTPS domain
              like https://coder.example.com. Workspaces connect back to
              Coder at this address, so it must work from other devices.
      ports:
        - container: "8080"
          description:
            en_US: Coder web UI, API, web terminals and workspace connections, published on host as 6145
      volumes:
        - container: /data
          description:
            en_US: >-
              The database (users, templates, workspaces, audit logs), the
              Terraform cache in coder/, and the database password in
              state/. Back up this folder.

x-casaos:
  id: com.icestore.coder
  architectures:
    - amd64
    - arm64
  main: coder
  author: HSinghHira
  category: Developer

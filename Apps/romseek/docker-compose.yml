name: romseek

services:
  romseek:
    image: ghcr.io/hsinghhira/romseek:latest
    container_name: romseek
    restart: unless-stopped
    stop_grace_period: 20s
    network_mode: bridge
    environment:
      - TZ=$TZ
      - PROWLARR_URL=http://CHANGEME-IP:9696
      - PROWLARR_KEY=
      - QBIT_URL=http://CHANGEME-IP:8080
      - QBIT_SAVE_PATH=/data/Downloads/roms
      - ROMM_URL=http://CHANGEME-IP:8080
      - ROMM_LIBRARY=/data/AppData/romm/library/roms
    ports:
      - target: 8000
        published: "6721"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/state
        target: /state
        bind:
          create_host_path: true
      - type: bind
        source: /DATA
        target: /data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 32M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/romseek/icon.png
    x-casaos:
      id: com.icestore.romseek
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS time zone.
        - container: PROWLARR_URL
          description:
            en_US: >-
              Required. Your Prowlarr's address, like http://192.168.1.20:9696
              (replace CHANGEME-IP with your ZimaOS IP).
        - container: PROWLARR_KEY
          description:
            en_US: >-
              Required. Prowlarr's API key (Settings, General, API Key).
        - container: QBIT_URL
          description:
            en_US: >-
              Required. qBittorrent's web UI address, like
              http://192.168.1.20:8080. RomSeek has no qBittorrent login: in
              qBittorrent, Options, WebUI, turn on "Bypass authentication for
              clients in whitelisted IP subnets" and add your Docker network
              (like 172.16.0.0/12).
        - container: QBIT_SAVE_PATH
          description:
            en_US: >-
              Where qBittorrent saves RomSeek's downloads, as both see it.
              Your ZimaOS /DATA is /data here: add the volume /DATA at /data to
              qBittorrent too, so both use the same path.
        - container: ROMM_URL
          description:
            en_US: >-
              Required. Your RomM's address, like http://192.168.1.20:8080.
        - container: ROMM_LIBRARY
          description:
            en_US: >-
              RomM's roms folder as RomSeek sees it (/DATA is /data here), like
              /data/AppData/romm/library/roms. Finished games are moved here.
      ports:
        - container: "8000"
          description:
            en_US: RomSeek web app, published on host as 6721
      volumes:
        - container: /state
          description:
            en_US: RomSeek's state (history, settings, the game list cache).
        - container: /data
          description:
            en_US: >-
              Your ZimaOS storage (/DATA), at /data as upstream mounts it, so
              qBittorrent's download paths and RomM's library line up.

x-casaos:
  id: com.icestore.romseek
  architectures:
    - amd64
    - arm64
  main: romseek
  author: HSinghHira
  category: Media
  developer: Evident-Dev
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/romseek/icon.png
  title:
    en_US: RomSeek
  tagline:
    en_US: Sonarr-style game search and library for RomM, using Prowlarr and qBittorrent.
  description:
    en_US: >-
      Visit: [https://icestore.hsinghhira.me/app/romseek/](https://icestore.hsinghhira.me/app/romseek/) for full details


      RomSeek is a game download manager for RomM. It does for games what
      Sonarr and Radarr do for TV and movies: search your Prowlarr indexers,
      pick a game, and RomSeek sends it to qBittorrent. When the download
      finishes, it puts the game in your RomM library.


      **Features**


      - Search every Prowlarr indexer for console games in one place

      - Detects the system for each result from the release name and a
        56,000-title game list

      - Sends downloads to qBittorrent and imports finished games into RomM

      - BIOS setup for the systems that need them

      - Blocks Windows programs and junk files; optional ClamAV gate


      **How to use?**


      1. Set the Prowlarr, qBittorrent and RomM addresses and the Prowlarr
         key before you install.


      2. Open RomSeek, search for a game and pick a result.


      3. The finished game shows up in RomM.
  tips:
    before_install:
      en_US: >-
        1. You need RomM, Prowlarr and qBittorrent running first.


        2. Open the app configuration. Replace CHANGEME-IP with your ZimaOS
           IP in PROWLARR_URL, QBIT_URL and ROMM_URL, and paste Prowlarr's
           API key into PROWLARR_KEY.


        3. Inside RomSeek your /DATA is /data. Give qBittorrent the same
           volume (/DATA at /data) so download paths match.


        4. RomSeek has no login. Keep it on your home network, or behind a
           reverse proxy with a login. Never open the port to the internet.


        5. Start the installation and open RomSeek from your dashboard.
  index: /
  port_map: "6721"
  scheme: http
  is_uncontrolled: false
  version: "ea4f909"
  update_at: "2026-11-10"
  release_notes:
    en_US: |-
      - First IceStore version: RomSeek from commit ea4f909 (upstream has no releases or image), on python:3.12-alpine as upstream runs it.
      - Port 6721; state in /DATA/AppData/romseek/state and /DATA mounted at /data (as upstream mounts it) for downloads and the RomM library.
  repo: "https://github.com/Evident-Dev/romseek"
  support: "https://github.com/Evident-Dev/romseek/issues"
  docs: "https://github.com/Evident-Dev/romseek/blob/main/docs/setup.md"

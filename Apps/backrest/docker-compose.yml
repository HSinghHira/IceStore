name: backrest

services:
  backrest:
    image: garethgeorge/backrest:v1.14.1
    container_name: backrest
    restart: unless-stopped
    network_mode: bridge
    environment:
      - TZ=$TZ
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
    ports:
      - target: 9898
        published: "6851"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/cache
        target: /cache
        bind:
          create_host_path: true
      - type: bind
        source: /DATA
        target: /DATA
      - type: bind
        source: /media
        target: /media
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9898/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/backrest/icon.png
    x-casaos:
      id: com.icestore.backrest
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone, for backup schedules. It is filled
              in from your ZimaOS time zone.
        - container: BACKREST_DATA
          description:
            en_US: >-
              Where Backrest keeps its own data. Leave it as
              /data.
        - container: BACKREST_CONFIG
          description:
            en_US: >-
              Backrest's settings file. Leave it as it is.
        - container: XDG_CACHE_HOME
          description:
            en_US: >-
              Restic's cache folder. Leave it as /cache.
        - container: TMPDIR
          description:
            en_US: >-
              Folder for temporary files during restores. Leave
              it as /tmp.
      ports:
        - container: "9898"
          description:
            en_US: >-
              Backrest web app, published on host as 6851
      volumes:
        - container: /data
          description:
            en_US: >-
              Backrest's operation history and logs.
        - container: /config
          description:
            en_US: >-
              Backrest's settings (config.json), with your
              repository passwords. Keep it private and back it
              up somewhere else too.
        - container: /cache
          description:
            en_US: >-
              Restic's cache. Safe to empty.
        - container: /DATA
          description:
            en_US: >-
              Your ZimaOS storage at the same path, to back up
              and restore.
        - container: /media
          description:
            en_US: >-
              Your other ZimaOS disks, for repositories on a
              second disk.

x-casaos:
  id: com.icestore.backrest
  architectures:
    - amd64
    - arm64
  main: backrest
  author: HSinghHira
  category: Others
  developer: "garethgeorge"
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/backrest/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/backrest/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/backrest/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/backrest/screenshot-3.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/backrest/screenshot-1.png
  title:
    en_US: Backrest
  tagline:
    en_US: Web interface for restic backups, with schedules and easy restores
  description:
    en_US: >-
      Visit: [https://icestore.hsinghhira.me/app/backrest/](https://icestore.hsinghhira.me/app/backrest/) for full details


      Backrest is a friendly web interface for restic, the fast and
      encrypted backup tool. Add a repository on another disk, a NAS or
      the cloud, plan what to back up and when, and browse snapshots to
      restore files in a few clicks.


      **Features**


      - Encrypted, deduplicated restic backups to disks, SFTP, S3, B2,
        rclone remotes and more

      - Plans with cron schedules and keep rules (hourly, daily, weekly)

      - Browse snapshots and restore files or folders from the browser

      - Prune and check jobs, with history and logs

      - Notifications to Discord, Slack, Gotify, ntfy, Shoutrrr and
        more, plus hooks


      **How to use?**


      1. Open Backrest right away and set the instance name and your
         login.

      2. Add a repository, like a folder under /media on a second disk,
         and choose its password.

      3. Add a plan with folders under /DATA and a schedule.
  tips:
    before_install:
      en_US: >-
        1. Start the installation. It is ready in a few seconds.


        2. Right away, open Backrest and set your user name and
           password. Until you do, anyone on your network can.


        3. Write down each repository password. Without it nobody can
           open the backups.
  index: /
  port_map: "6851"
  scheme: http
  is_uncontrolled: false
  version: "v1.14.1"
  update_at: "2026-11-25"
  release_notes:
    en_US: |-
      - First IceStore release: garethgeorge/backrest v1.14.1 on port 6851
      - /DATA and /media are shared at the same paths for backups and restores
  repo: "https://github.com/garethgeorge/backrest"
  support: "https://github.com/garethgeorge/backrest/issues"
  docs: "https://garethgeorge.github.io/backrest/"

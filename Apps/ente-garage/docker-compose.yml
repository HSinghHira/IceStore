name: ente-garage

services:
  ente-garage:
    image: ghcr.io/hsinghhira/ente-garage:latest
    container_name: ente-garage
    restart: unless-stopped
    stop_grace_period: 90s
    privileged: true
    environment:
      - TZ=$TZ
      - PUBLIC_URL=http://localhost:6600
    ports:
      - target: 8080
        published: "6600"
        protocol: tcp
      - target: 8081
        published: "6601"
        protocol: tcp
      - target: 8082
        published: "6602"
        protocol: tcp
      - target: 8083
        published: "6603"
        protocol: tcp
      - target: 8104
        published: "6604"
        protocol: tcp
      - target: 8105
        published: "6605"
        protocol: tcp
      - target: 8106
        published: "6606"
        protocol: tcp
      - target: 8107
        published: "6607"
        protocol: tcp
      - target: 8108
        published: "6608"
        protocol: tcp
      - target: 8109
        published: "6609"
        protocol: tcp
      - target: 8110
        published: "6610"
        protocol: tcp
      - target: 8111
        published: "6611"
        protocol: tcp
      - target: 8112
        published: "6612"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3072M
        reservations:
          cpus: "0.25"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-garage/icon.png
    x-casaos:
      id: com.icestore.ente-garage
      envs:
        - container: TZ
          description:
            en_US: >-
              Your time zone. It is filled in from your ZimaOS time zone.
              Leave it unless you need another.
        - container: PUBLIC_URL
          description:
            en_US: >-
              The address of the Web App, like
              http://your-zimaos-ip:6600. Change localhost to your ZimaOS
              IP, or phones and other computers cannot use Ente. The other
              apps use the same address with the next ports: 6601 API,
              6602 Public Albums, 6603 photo storage, 6604 mail viewer,
              and 6605 to 6612 for Accounts, Auth, Cast, Public Locker,
              Embed, Paste, Locker and Public Memories.
      ports:
        - container: "8080"
          description:
            en_US: Web App (Ente Photos), published on host as 6600
        - container: "8081"
          description:
            en_US: Ente API - the server address for the phone and desktop apps, published on host as 6601
        - container: "8082"
          description:
            en_US: Public Albums (shared album links), published on host as 6602
        - container: "8083"
          description:
            en_US: >-
              Photo storage (Garage S3). Phones and browsers upload and
              download your encrypted files here, published on host as 6603
        - container: "8104"
          description:
            en_US: Mail viewer for sign-up codes and other Ente emails, published on host as 6604
        - container: "8105"
          description:
            en_US: Accounts app (passkeys and family invites), published on host as 6605
        - container: "8106"
          description:
            en_US: Ente Auth web app (your two-factor codes), published on host as 6606
        - container: "8107"
          description:
            en_US: Cast app (show albums on a TV), published on host as 6607
        - container: "8108"
          description:
            en_US: Public Locker (shared Locker links), published on host as 6608
        - container: "8109"
          description:
            en_US: Embed app (albums inside other web pages), published on host as 6609
        - container: "8110"
          description:
            en_US: Ente Paste (share text that deletes itself), published on host as 6610
        - container: "8111"
          description:
            en_US: Ente Locker web app (store important documents), published on host as 6611
        - container: "8112"
          description:
            en_US: Public Memories (shared memory links), published on host as 6612
      volumes:
        - container: /data
          description:
            en_US: >-
              Your encrypted photos and videos (Garage), the database,
              secret keys and settings.

x-casaos:
  id: com.icestore.ente-garage
  architectures:
    - amd64
    - arm64
  main: ente-garage
  author: HSinghHira
  category: Media
  developer: ente-io
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-garage/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-garage/screenshot-1.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-garage/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-garage/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-garage/screenshot-3.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/IceStore@main/Apps/ente-garage/screenshot-4.png
  title:
    en_US: Ente - Garage S3
  tagline:
    en_US: End-to-end encrypted photo storage, with Garage for the files
  description:
    en_US: >-
      Ente is a self-hosted, end-to-end encrypted place to store, share and
      rediscover your photos and videos on all your devices. This is Ente in
      a single container, with PostgreSQL, Garage, a lightweight open-source object store, and a mail viewer
      for sign-up codes inside. Secret keys and passwords are made for you on
      first start.


      **Features**


      - End-to-end encryption for every photo and video


      - All ten Ente web apps, each on its own port: Photos, Public
        Albums, Accounts, Auth, Cast, Locker, Public Locker, Embed,
        Paste and Public Memories


      - Works with the Ente phone and desktop apps


      - Garage for S3-compatible photo storage, with a small memory footprint


      - Built-in mail viewer on port 6604 for sign-up codes, or use your
        own email server


      - No 10 GB limit: every account gets 100 TB by default


      **How to use?**

      1. Open Ente - Garage S3 from the Zima OS dashboard.

      2. Sign up with your email and a password.

      3. Open the mail viewer on port 6604 to read your sign-up code.

      4. Type the code to finish signing up.

      5. In the Ente phone app, tap the first screen 7 times and set the
         server to http://your-zimaos-ip:6601.

      6. Upload photos and share albums.
  tips:
    before_install:
      en_US: >-
        1. Open the app configuration before you install.


        2. Find PUBLIC_URL. Change localhost to your ZimaOS IP, for example
           http://192.168.1.20:6600 (your own IP will differ). Phones
           cannot use localhost.


        3. More settings, like your own email server and sign-up, are listed
           on the Ente - Garage S3 page at
           https://icestore.hsinghhira.me/app/ente-garage/ (Variables tab). You
           can add them now or later in the app settings.


        4. Start the installation.


        5. Wait about three minutes. The first start sets up the database.


        6. Open the app logs and scroll to the top. Find the line that says
           "mail viewer login". Write down the password.


        7. Open http://your-zimaos-ip:6600 in your browser. Sign up with
           your email and a password.


        8. Open http://your-zimaos-ip:6604 in a new tab. Sign in
           as admin with the mail password. Copy the code from the email.


        9. Type the code in Ente to finish signing up.


        10. For the phone app: tap the first screen 7 times. Set the server
            to http://your-zimaos-ip:6601 and sign in.
  index: /
  port_map: "6600"
  scheme: http
  is_uncontrolled: false
  version: "20fb631"
  update_at: "2026-10-27"
  release_notes:
    en_US: |-
      - New ports: 6600 Web App, 6601 API, 6602 Public Albums, 6603 photo storage,
        6604 mail viewer, 6605-6612 the other web apps
      - Adds the Accounts (passkeys), Auth, Cast, Public Locker, Embed, Paste, Locker
        and Public Memories apps, and tells the Ente server where each one is
      - Mail viewer has its own port; /mail/ on the Web App still works
      - Old installs on 6133-6136 keep working: every address counts up from
        PUBLIC_URL's port. Reinstall to get the new apps' ports
      - New settings ENTE_APPS_* (Ente's own names); ENTE_ALBUMS_URL still works
      - Single-container Ente with Garage storage and one data folder
      - Database, storage and museum keys are made on first start, so each install gets its own
      - Sign-up codes go to the built-in mail viewer unless you set your own email server
      - Every account gets 100 TB instead of Ente's 10 GB (ENTE_AIO_STORAGE_GB)
      - server 20fb631, web 817ce84 (Ente only publishes commit tags; they follow latest)
      - garage v2.4.1, mailpit v1.32.0, PostgreSQL 15
  repo: "https://github.com/ente/ente"
  support: "https://github.com/ente/ente/issues"
  docs: "https://ente.com/help/self-hosting/"
